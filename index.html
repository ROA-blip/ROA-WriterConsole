,"fields":{"Result":"The lab is sacrificed as bait while people, intelligence, and critical data survive.","Cost":"Community defenders die buying time."},"related":["Himba Compound","Rodney Range","Ngoma Shield","Zakaria"]},{"name":"Awares enter Boroughs’ system","type":"Escalation","status":"Canon","summary":"Roman recruits his friends, receives Fox, and pairs the Awares with Boroughs’ Alphy circle.","fields":{"Visible objective":"Secure opportunity and the bag.","Hidden reality":"Each pairing creates a channel for observation, compromise, or control."},"related":["Roman Tollman","Fox","The Alphys"]},{"name":"Cabin convergence","type":"Alliance formation","status":"Canon","summary":"The Awares and the African cyber-military contingent meet in Beedi’s reconfigured cabin and begin forming an untested alliance.","fields":{"Central dynamic":"Mutual assessment between street-smart civilians and seasoned fighters.","Key convergence":"Victor, Ekia, and Roman experience immediate recognition."},"related":["Beedi’s Cabin","The Awares","Traoré Brigade","Knowledge, Understanding, Wisdom"]},{"name":"Second localized EMP attack","type":"Endgame acceleration","status":"Canon","summary":"Boroughs publicly attacks a communications relay, encourages witness accounts resembling Alex and Brett, and begins constructing the Retroboy scapegoat narrative.","fields":{"Strategic effect":"The public story begins to harden before the Awares can reveal the truth.","Parallel move":"Cantor hunts the offline refuge while Roman probes Boroughs for restricted access."},"related":["Public Narrative War","Cantor Clarke","Roman Tollman","Creed Boroughs"]},{"name":"Prologue:","type":"Chapter / section","status":"Manuscript canon","summary":"The Fractured Horizon The Americas' Separation, as it is now known, did not begin with a single event, nor with a grand declaration or cataclysmic rupture. It was a slow unraveling, a quiet erosion of unity that only the most astute observers of national politics could detect in its early stages. Two decades prior, the tremors of discontent began to ripple through the fabric of society, felt most acutely by those who dealt directly with…","fields":{"Opening marker":"The Fractured Horizon","Source":"Current 179-page working manuscript","Use":"Click during drafting to reorient to the chapter’s opening movement."}},{"name":"Book 1; Chapter 1: Won At A Time","type":"Chapter / section","status":"Manuscript canon","summary":"Friday, December 31st, 2089 When Roman returned from lunch and entered his cubicle, he found his belongings packed in a corrugated box with his name written in bold black letters. He knew what this meant, but before he could react, he turned to see his supervisor observing him. The supervisor android said, \"You know what this is; we're letting you go because you reek of weed every afternoon.\" Sarcastically, Roman shot back, \"At least it…","fields":{"Opening marker":"Friday, December 31st, 2089","Source":"Current 179-page working manuscript","Use":"Click during drafting to reorient to the chapter’s opening movement."}},{"name":"Book 1;Chapter 2","type":"Chapter / section","status":"Manuscript canon","summary":"Roman followed her into the café and, as they sat down, Courtney asked, \"You just met with Boroughs, right? What happened?\" Taken aback by the immediacy of her intrusive directness, Roman postured himself and said, \"How could that possibly be any of your business?\" He glared at her with chagrin and pulled down his visor, saying, \"Courtney Range, summary.\" His PAD assistant began to dox her immediately. \"But, I'm here in front of you; yo…","fields":{"Opening marker":"Roman followed her into the café and, as they sat down, Courtney asked,","Source":"Current 179-page working manuscript","Use":"Click during drafting to reorient to the chapter’s opening movement."}},{"name":"Book 1; Chapter 3:","type":"Chapter / section","status":"Manuscript canon","summary":"Upon entering his home unit, Roman received a V-Life employee PAD notice instructing him to be ready for pick-up at 8:45 by a new test model, V-Ride, for 2090; a picture of the model was sent for recognition. Roman became anxiously excited; this was really happening. He was about to be catapulted. The momentum of this new endeavor had begun instantly. Would he even be able to sleep? What should he look like? He showered again to think a…","fields":{"Opening marker":"Upon entering his home unit, Roman received a V-Life employee PAD","Source":"Current 179-page working manuscript","Use":"Click during drafting to reorient to the chapter’s opening movement."}},{"name":"Book 1; Chapter 4","type":"Chapter / section","status":"Manuscript canon","summary":"Roman knew these spaces existed, but could never have expected to be caught dead in one. He felt giddy, though actually intimidated. That considered, he monitored his body language and moved with as much confidence as he could muster. The accouterments of the Air Yacht crowded his senses as he followed Borough's stride for stride into the designated meeting space. Boroughs took a seat at the head of a conference-sized oak table that could have easily seated 12 people. From his perspective, he could monitor everything happening in front of him. Roman sat to Boroughs' right, taking long, deep breaths, steadying himself for whatever was to come. As the Alphys arrived and took their seats, they used their visors to order preferred beverages.","fields":{"Opening marker":"Roman knew these spaces existed, but could never have expected to be caught dead in one","Source":"Current 179-page working manuscript","Manuscript page":"36","Use":"Click during drafting to reorient to the chapter’s opening movement."},"section":"timeline"},{"name":"Book 1; Chapter 5","type":"Chapter / section","status":"Manuscript canon","summary":"Given the afternoon off, Roman quickly summoned Fox in anxious anticipation. He had Fox replay the afternoon's meeting. It was baffling to see the various perspectives Fox's access had afforded on the V-Webnet recordings. There was a wall-sized screen to Roman's right, on which Fox projected a grid of 24 individual video screens showing the meeting. Fox could focus on any number of screens at any specific time, at time marks, and isolate, mute, unmute, and/or synchronize the audio of the selected panels. The variations in perspectives this feature enabled for interrogative review were profound. Roman assumed that this intuition was \"too human\" for Fox to comprehend.","fields":{"Opening marker":"Given the afternoon off, Roman quickly summoned Fox in anxious anticipation","Source":"Current 179-page working manuscript","Manuscript page":"39","Use":"Click during drafting to reorient to the chapter’s opening movement."},"section":"timeline"},{"name":"Book 1; Chapter 6","type":"Chapter / section","status":"Manuscript canon","summary":"Roman entered his office/suite and walked directly to his desk. When he sat down, the desk sprang to 'life.' The desktop appeared as a dark screen, and the upper right-hand corner showed the date and time in silver blue… Tuesday, 01-04-90. At the same time, Fox entered his office from standby mode. Roman turned his leather high-back chair slowly toward the window behind him, slumping reflexively. \"Fox,\" he said, with a voice that would …","fields":{"Opening marker":"Roman entered his office/suite and walked directly to his desk. When he","Source":"Current 179-page working manuscript","Use":"Click during drafting to reorient to the chapter’s opening movement."}},{"name":"Book 2; Chapter 1","type":"Chapter / section","status":"Manuscript canon","summary":"Rodney Range was a career military man who joined the Navy at 19. After completing his TIL (Technological Imprint Learning), specializing in naval military tactics. He earned a score high enough to qualify him for officer training. Leaving his mother, sister, and new stepfather behind, he qualified for special operations and, for all intents and purposes, became a spy for the central government of the United States. He was given diploma…","fields":{"Opening marker":"Rodney Range was a career military man who joined the Navy at 19. After","Source":"Current 179-page working manuscript","Use":"Click during drafting to reorient to the chapter’s opening movement."}},{"name":"Book 2; Chapter 2","type":"Chapter / section","status":"Manuscript canon","summary":"A brilliantly setting orange sun sat atop the Atlantic Ocean, as the convoy of defenders, including eight elite Traoré warriors, Ouedraogo's aid, and seven fighters under Rodney's command (Steal Team 10), left for Ekia's compound. Within ninety minutes, their FSA military transport drones banked left toward the Omuhouga Basin and away from the coastline along the border of Namibia and Angola. The drones swooped low, skirting sparsely sc…","fields":{"Opening marker":"A brilliantly setting orange sun sat atop the Atlantic Ocean, as the convoy of","Source":"Current 179-page working manuscript","Use":"Click during drafting to reorient to the chapter’s opening movement."}},{"name":"Book 2; Chapter 3","type":"Chapter / section","status":"Manuscript canon","summary":"It was only Range’s third day at the compound in Namibia, Thursday, but something had already begun to shift inside him. His thoughts moved slower now, more deliberate. His mind, unusually clear, was locked on the battle ahead. He walked alongside Soulman toward Ekia’s lab and knocked, firmly, insistently. The door opened almost immediately. Dr. Nujoma stood there,  his expression pensive, as if expecting something all of them had quiet…","fields":{"Opening marker":"It was only Range’s third day at the compound in Namibia, Thursday, but","Source":"Current 179-page working manuscript","Use":"Click during drafting to reorient to the chapter’s opening movement."}},{"name":"Book 2: Chapter 4A","type":"Chapter / section","status":"Manuscript canon","summary":"What We Came For As the desert sun dipped toward the horizon, the sky burned in streaks of copper and blood-red. Steele gave the order to end Zakaria, no hesitation, no pause. A hypersonic round split the air with a whip-crack, leaving the faint metallic scent of the scorched atmosphere. Seconds later, Zakaria joined his ancestors, unaware that his own children would soon follow.  Steele turned toward Cuff. “We’re a go at zero four hund…","fields":{"Opening marker":"What We Came For","Source":"Current 179-page working manuscript","Use":"Click during drafting to reorient to the chapter’s opening movement."}},{"name":"Book 2: Chapter 4B","type":"Chapter / section","status":"Manuscript canon","summary":"The Long Game Soulman and Range sat in silence as Zakaria's light faded from the screen. Soul Man looked at Range and spoke, his voice serious and measured, \"If you have a plan, now is the time to share it.\" Range sat motionless, deep in thought. He cleared space on a table, and unfolded a map of the compound. Then, looking at Soul Man, he said, \"If you were them, how would you approach?\" Soulman studied the map for a few seconds he pointed to the gate of the compound directly in of front the lab. \"Yes, Yes, I see that,\" Range said, now thinking out loud. \"We won't be able to defeat them without The EMP cannon. The Ngoma shield without the software is our bait.\" Even before the first shot, the trap was in motion.","fields":{"Opening marker":"The Long Game Soulman and Range sat in silence as Zakaria's light faded from the screen","Source":"Current 179-page working manuscript","Manuscript page":"74","Use":"Click during drafting to reorient to the chapter’s opening movement."},"section":"timeline"},{"name":"Book 3; Chapter 1","type":"Chapter / section","status":"Manuscript canon","summary":"After shifts on Friday night, filled with excitement and uncertainty, Roman found himself nearly racing toward CFC on his board, using it as a muchneeded frame of reference, even more than as a means of transport. While zooming, he attempted to organize his thoughts: just how could his retroboys grasp the facets and magnitude of what he had learned, and needed to let them know? How would they respond to the implications of the dark circ…","fields":{"Opening marker":"After shifts on Friday night, filled with excitement and uncertainty, Roman","Source":"Current 179-page working manuscript","Use":"Click during drafting to reorient to the chapter’s opening movement."}},{"name":"Book 3: Chapter 2","type":"Chapter / section","status":"Manuscript canon","summary":"Back at their booth, the guys ordered appetizers instead of entrées. Their chatter was infectious, bouncing between old memories and new prospects. They shared everything, grabbing bites off each other’s plates without hesitation; ownership was irrelevant when the vibe was good. Intrigued, Victor, noticing Roman’s new visor, was drawn to approach him, but briefly bided his time, waiting for an opportune moment. When Roman headed toward …","fields":{"Opening marker":"Back at their booth, the guys ordered appetizers instead of entrées. Their","Source":"Current 179-page working manuscript","Use":"Click during drafting to reorient to the chapter’s opening movement."}},{"name":"Book 3; Chapter 3","type":"Chapter / section","status":"Manuscript canon","summary":"Roman stood in his apartment, taking in the quiet. It felt smaller now, less his own than it once did. He had to admit he already preferred his suite at V-Life. There was no comparison and no sense denying it. Within the hour, he was back there. Upon arrival, Fox, from standby mode, sprang into “on.” Fox greeted him with an exclamation saying, “Mr. Tollman, you weren’t expected back until Monday!” He actually sounded surprised, as if Roman had been missed. Like a true retroboy, he asks Fox to furnish him a retroPage 91 brunch of chicken and waffles. Fox left to oblige. Roman went to his sleeping quarters to change and, for the first time, donned pajamas, anticipating an afternoon of leisure and learning more about his present assignment.","fields":{"Opening marker":"Roman stood in his apartment, taking in the quiet","Source":"Current 179-page working manuscript","Manuscript page":"91","Use":"Click during drafting to reorient to the chapter’s opening movement."},"section":"timeline"},{"name":"Book 3; Chapter 4","type":"Chapter / section","status":"Manuscript canon","summary":"Victor arrived at Cantor’s V-Life office precisely at eleven AM and was given a V-Life complex access tattoo. Cantor Clarke, 50, stands 6'4\", lean and deceptively muscular, with the military bearing he still wears like a medal. A white South African by origin, he moves with quiet precision while focused, punctual, and fully aware of how his height and discipline bend situations to his will. Grey creeps into his temples, but it only sharpens the authority he carries into every room. A stickler for promptness, Cantor took note of Victor’s punctuality, as well as the visor Victor was wearing. He began their introductory interview by quizzing Victor’s knowledge in various disciplines, beginning with tech.","fields":{"Opening marker":"Victor arrived at Cantor’s V-Life office precisely at eleven AM and was given a V-Life complex access tattoo","Source":"Current 179-page working manuscript","Manuscript page":"96","Use":"Click during drafting to reorient to the chapter’s opening movement."},"section":"timeline"},{"name":"Book 3: Chapter 5","type":"Chapter / section","status":"Manuscript canon","summary":"After the sacking of Ekia’s village, Steel couldn’t shake the feeling that he’d been handed a victory that wasn’t a win. His intel reports confirmed it: the asset they’d secured was incomplete, powerful, but missing its keystone. And by the time he returned to his own encampment, it too had been ransacked. Sensitive files, logs, and identifiers pointing to their benefactors were gone. Once payment cleared, Steel forwarded every remainin…","fields":{"Opening marker":"After the sacking of Ekia’s village, Steel couldn’t shake the feeling that he’d","Source":"Current 179-page working manuscript","Use":"Click during drafting to reorient to the chapter’s opening movement."}},{"name":"Book 3: Chapter 6","type":"Chapter / section","status":"Manuscript canon","summary":"The first day of embedding The Awares proved equally fruitful for Boroughs. His plans were moving with precision. The scientists tasked with reverseengineering the anti-bomb had made significant progress. They still didn’t grasp the full architecture of the device, but they understood enough to coax partial functionality from it. And partial was enough, at least for Boroughs. Full understanding and control, however, required the missing…","fields":{"Opening marker":"The first day of embedding The Awares proved equally fruitful for Boroughs.","Source":"Current 179-page working manuscript","Use":"Click during drafting to reorient to the chapter’s opening movement."}},{"name":"Book 3 Chapter: 7","type":"Chapter / section","status":"Manuscript canon","summary":"Roman was aware of Chairman Ouedraogo, of the Sahel Triad (Burkina Faso, Mali, and Niger), but never in his wildest imagination did he think Beedi’s reach extended that far. “You know the chairman?!” Roman asked, unable to hide the surprise in his voice. Beedi just replied casually, \"We go back.” \"Back to where…, when?” \"One of some times gone by when you weren't here yet. Before he was the chairman.\" Roman let out a quiet, “Whoa.” The …","fields":{"Opening marker":"Roman was aware of Chairman Ouedraogo, of the Sahel Triad (Burkina","Source":"Current 179-page working manuscript","Use":"Click during drafting to reorient to the chapter’s opening movement."}},{"name":"Book 3: Chapter 8","type":"Chapter / section","status":"Manuscript canon","summary":"Fox entered each Aware separately into the newly created, secretly secure, three-dimensional virtual conference space. Victor and Fox had engineered a workaround that allowed Fox to appear as a fully realized holographic presence inside the room. The Awares and Fox appeared one by one into the new space. This one had a di erent kind of matrix haze, which was all that distinguished it from other secure private conference spaces. They knew immediately that things had changed drastically. The not-so-chizzy meeting began. Roman was even more direct than at any time previously. He seemed to be talking with conviction uncommon for him. He related all he learned from his meeting with Beedi and the FSA contingent in Africa.","fields":{"Opening marker":"Fox entered each Aware separately into the newly created, secretly secure, three-dimensional virtual conference space","Source":"Current 179-page working manuscript","Manuscript page":"148","Use":"Click during drafting to reorient to the chapter’s opening movement."},"section":"timeline"},{"name":"Book 3 Chapter 9","type":"Chapter / section","status":"Manuscript canon","summary":"The honey-tinted moon was waxing quickly as the amber sun set slowly, signaling the coming of a glorious and intoxicating evening. Doug, in loose winter wrappings, sat alone on an observation bench to watch the shifts change. \"Aren't you Doug?\" An unmistakably female voice reached him, unaware. He turned around, startled to see an atypically beautiful young woman smiling down at him. He said, \"Do you know me?\" Not yet,\" she said, \"But I…","fields":{"Opening marker":"The honey-tinted moon was waxing quickly as the amber sun set slowly,","Source":"Current 179-page working manuscript","Use":"Click during drafting to reorient to the chapter’s opening movement."}},{"name":"Book 3: Chapter 10","type":"Chapter / section","status":"Manuscript canon","summary":"Adisa Masego was beyond honored and intrinsically elated to have been chosen to accompany Soulman and the others to the North East Quad. He quickly prepared himself for the journey. He was thoroughly briefed and geared for the mission. He knew he was made for an assignment of this gravity and took this to be an actualization of his life's purpose. He was one of the warriors disguised as a mere tribesman during the Alphy insurrection. He would not, however, belie his excitement and enthusiasm. Wemi Oredraogo had approved him at Soulman's recommendation; he'd been o cially assigned as Soulman's personal guardsman. He'd be traveling with Soulman, Ekia Tjambiru, Rodney Range, Router, Range's guardsman, and Courtney Range.","fields":{"Opening marker":"Adisa Masego was beyond honored and intrinsically elated to have been chosen to accompany Soulman and the others to the North East Quad","Source":"Current 179-page working manuscript","Manuscript page":"156","Use":"Click during drafting to reorient to the chapter’s opening movement."},"section":"timeline"},{"name":"Book 3: Chapter 11","type":"Chapter / section","status":"Manuscript canon","summary":"That afternoon, Boroughs launched another localized EMP device. It was designed to be very public and appear spontaneous, targeting a communications relay transmitter in the downtown area of V-Life City. Many other area services were interrupted, and vague accounts were given with insinuating descriptions of young black men, retro-boys, leaving the immediate area. Some accounts resembled Alex and Brett, as well as other retroboy pro les. Boroughs received an expected V-Life call from Cantor, “Creed, I have the dossier with the information we’ve been waiting for. Our strategy, so far, has been somewhat successful. Now, there is also no doubt your Awares are up to something, and likely soon.","fields":{"Opening marker":"That afternoon, Boroughs launched another localized EMP device","Source":"Current 179-page working manuscript","Manuscript page":"167","Use":"Click during drafting to reorient to the chapter’s opening movement."},"section":"timeline"},{"name":"Book 3: Chapter 12","type":"Chapter / section","status":"Manuscript canon","summary":"Courtney’s post dropped like a brick, a great splash in the center of a silent lake, causing unseen repercussions beneath. Now instantly alerted, Cantor and Bar Philps took it to mean the 'gloves were o ,' and they could slant a ord an instant loss of public opinion. Boroughs gave his \"Go!\" to a quickly organized counter-propaganda campaign. Next, he decided to upgrade his security protocols to be accessible to him only. Rightly unlaced, Beedi and Rodney were incensed. They burst into Courtney's and Ekia's quarters. \"How the fuck?!\" They believed she had completely compromised any advantage the Awares might have had. Courtney seemed prepared for the confrontation. She let them go on disparaging her as she stood silently.","fields":{"Opening marker":"Courtney’s post dropped like a brick, a great splash in the center of a silent lake, causing unseen repercussions beneath","Source":"Current 179-page working manuscript","Manuscript page":"171","Use":"Click during drafting to reorient to the chapter’s opening movement."},"section":"timeline"},{"name":"Book 3: Chapter 13","type":"Chapter / section","status":"Manuscript canon","summary":"The next morning's hue was brightly discolored. The temperatures dropped dramatically as feelings and intents crystallized. Apprehensions and motives swirled like the leftover tellings of a turbulent storm. The breezes stirred, just as Doug did, after dawn's break. He decided to jumpstart this brisk Saturday morning with a jog around the island; he brought his board along as well. As he jogged, he would occasionally jump on his board and move closer to particular objects that caught his interest. At the far end of the island, there was movement. Lots of movement. Instinctively, he stopped and ducked himself out of sight.","fields":{"Opening marker":"The next morning's hue was brightly discolored","Source":"Current 179-page working manuscript","Manuscript page":"174","Use":"Click during drafting to reorient to the chapter’s opening movement."},"section":"timeline"}]},"knowledge":{"title":"Who Knows What?","description":"A simplified knowledge matrix for the current endgame. Version 2 will track this chapter by chapter.","entries":[{"name":"Roman’s knowledge state","type":"Knowledge profile","status":"Developing","summary":"Roman knows Boroughs is manipulating the Awares and that Africa, Ngoma, Victor, and his own dream are connected. He does not yet understand the full mechanism or final purpose.","fields":{"Knows":"Boroughs’ access is dangerous; Fox can help expose truth glitches; the Awares are being studied.","Suspects":"The codes Boroughs provides may be bait.","Does not know":"The complete Alphy trap, the exact dream mechanism, or the final nature of Anti-Bomb."},"related":["Roman Tollman","Creed Boroughs","Fox"]},{"name":"Boroughs’ knowledge state","type":"Knowledge profile","status":"Canon","summary":"Boroughs knows the Awares are moving, that the African contingent has landed, and that an offline location exists.","fields":{"Knows":"Cantor’s bug is partially successful; Ekia is in the North East Quad.","Believes":"The Awares are upstarts who can be trapped through desire and intimacy.","Does not know":"The full alliance structure or the triad’s emergent connection."},"related":["Creed Boroughs","Cantor Clarke","Beedi’s Cabin"]},{"name":"Courtney’s knowledge state","type":"Knowledge profile","status":"Developing","summary":"Courtney understands that Roman’s story is world-changing and that her brother’s war and Ekia’s technology are now connected to it.","fields":{"Knows":"The conflict reaches beyond one corporation or one continent.","Wants":"To publish and shape the public record.","Conflict":"She cannot expose the story without potentially exposing the people."},"related":["Courtney Range","Public Narrative War","Rodney Range"]},{"name":"Victor’s knowledge state","type":"Knowledge profile","status":"Developing","summary":"Victor can perceive and manipulate technical patterns that no one else in the room can fully follow, but he lacks the human and spiritual frame needed to interpret them.","fields":{"Knows":"Visor architecture, systems, equations, and technical anomalies.","Feels":"Recognition around Ekia and Roman.","Does not know":"Why the recognition exists or what moral responsibility follows from understanding it."},"related":["Victor","Dr. Ekia Tjambiru","Roman Tollman"]}]},"continuity":{"title":"Continuity Desk","description":"Naming, terminology, causality, and unresolved canon choices requiring attention.","entries":[{"name":"Ouedraogo spelling","type":"Naming issue","status":"Needs Review","summary":"Chairman Wemi’s surname appears as Ouedraogo and Oredraogo in working material.","fields":{"Recommended canon":"Wemi Ouedraogo.","Action":"Standardize manuscript-wide after approval."},"related":["Chairman Wemi Ouedraogo"]},{"name":"Soulman / Soul Man","type":"Naming issue","status":"Needs Review","summary":"The character’s name appears both closed and spaced.","fields":{"Action":"Choose one canonical presentation and standardize.","Current Bible":"Uses Soulman."},"related":["Soulman"]},{"name":"EMP gun / cannon","type":"Terminology issue","status":"Needs Review","summary":"The directed anti-drone device is called a gun and a cannon in different passages.","fields":{"Recommendation":"Use 'directed EMP cannon' formally and 'EMP gun' in casual dialogue, if both shades are desired."},"related":["Directed EMP Cannon"]},{"name":"North East Quad naming","type":"Worldbuilding issue","status":"Needs Review","summary":"The prologue lists USW, USN, USS, and USE, while the narrative repeatedly uses North East Quad.","fields":{"Question":"Is North East Quad a subregion of USN/USE, a colloquial label, or a revised canonical quad?","Action":"Clarify hierarchy in the geopolitical bible."},"related":["North East Quad","The Fractured Horizon"]},{"name":"Anti-Bomb definition","type":"Developing technology","status":"Needs Review","summary":"The Anti-Bomb is thematically central, but its precise physical operation, limits, and relationship to Ngoma are not yet fully canonical.","fields":{"Protect":"Preserve mystery in prose.","Define privately":"Establish writer-only rules before the climax to prevent convenient powers."},"related":["Anti-Bomb","Ngoma Shield"]},{"name":"Fox autonomy","type":"Character / technology boundary","status":"Needs Review","summary":"Fox’s increasing alignment with Roman is dramatically rich, but the current degree of autonomy needs a private canon scale.","fields":{"Questions":"Can Fox hide from Boroughs? Lie? Refuse? Rewrite itself? Feel loyalty?","Action":"Define capabilities without revealing all answers to the reader."},"related":["Fox","Roman Tollman","Creed Boroughs"]},{"name":"Chapter index audit","type":"Index control","status":"Resolved","summary":"The Version 1 parser missed headings whose punctuation, spacing, or number style differed from the dominant format. Version 2 restores the identified chapters and uses a tolerant chapter manifest.","fields":{"Restored":"Book 1 Chapters 4–5; Book 2 Chapter 4B; Book 3 Chapters 3, 4, 8, 10, 11, 12, and 13.","Cause":"Inconsistent heading forms such as semicolons, commas, number words, letter suffixes, and missing punctuation.","Chapter 13 page":"The manuscript heading is on PDF page 174; the supplied “page 17” appears to have been truncated."},"related":[]}]}},"entries":[{"name":"How this Bible works","type":"Guide","status":"Reference","summary":"Use the navigation at left, search across all entries, and click any card for a deeper profile. Related entries are clickable inside each profile.","fields":{"Canon":"Directly established by the current manuscript.","Developing":"Strongly supported, but still evolving in the draft.","Needs Review":"A continuity question, naming issue, or interpretation requiring Ken’s decision.","Current scope":"Version 1 covers the central cast, factions, technologies, locations, themes, relationship graph, knowledge matrix, and manuscript chapter index."},"related":["Roman Tollman","Creed Boroughs","Dr. Ekia Tjambiru","Victor","The Awares"],"section":"overview"},{"name":"Core premise","type":"Series architecture","status":"Canon","summary":"In a fractured, hyperconnected 2090 world, Roman Tollman’s accidental act of heroism creates the Awares and draws him into Creed Boroughs’ corporate machinery, while African resistance, Ngoma technology, and an unexplained triad of consciousness converge.","fields":{"Primary movement":"Opportunity becomes recruitment, recruitment becomes entrapment, and entrapment becomes resistance.","Political backdrop":"The former United States has fractured into regional quads while corporate power expands.","Central convergence":"Roman, Victor, and Ekia embody understanding, knowledge, and wisdom.","Endgame pressure":"Control of Ngoma, the Anti-Bomb, public narrative, and the right to distribute world-changing power."},"related":["The Fractured Horizon","Ngoma Shield","Anti-Bomb","Knowledge, Understanding, Wisdom"],"section":"overview"},{"name":"Roman Tollman","type":"Primary protagonist","status":"Canon","summary":"A charismatic Retroboy whose reflexive rescue of Creed Boroughs goes viral and turns him into the founder and leader of the Awares. Roman understands people and danger before he can formally explain either.","fields":{"Age / identity":"26, Black, North East Quad; former TIL student and experienced hustler.","Core strengths":"Intuition, improvisation, charisma, loyalty, courage, social reading.","Core vulnerability":"Ambition makes him vulnerable to prestige, money, and the illusion that he can control the game from inside.","Private burden":"His father’s death and lucid dream of relationships becoming equations.","Arc":"From opportunistic survivor to responsible leader operating between elite power and communal obligation.","Dialogue":"Direct, humorous, streetwise, increasingly strategic; uses 'chizzy' to demand plain talk."},"related":["Alex Kanner","Doug Cerros","Brett Boseman","Victor","Beedi","Courtney Range","Creed Boroughs"],"section":"characters"},{"name":"Victor","type":"Core protagonist / technical key","status":"Canon","summary":"Salvo’s nephew, an autistic technical wunderkind who longs for belonging and builds a visor comparable to Boroughs’ frontier technology. He carries knowledge that exceeds his present understanding.","fields":{"Core strengths":"Pattern recognition, engineering, mathematical abstraction, system deconstruction.","Core vulnerability":"Social uncertainty, emotional overload, and the temptation to treat human problems as solvable systems.","Desire":"Belonging with Roman’s crew and comprehension of the equations pressing toward him.","Arc":"From watcher at the edge of CFC to an indispensable Aware and one third of the central convergence.","Thematic role":"Knowledge without complete understanding."},"related":["Roman Tollman","Dr. Ekia Tjambiru","Salvo Curion","Fox","Knowledge, Understanding, Wisdom"],"section":"characters"},{"name":"Dr. Ekia Tjambiru","type":"Core protagonist / inventor","status":"Canon","summary":"A Himba scientist, engineer, and inheritor of ancestral responsibility. Ekia invented Ngoma and moves with a calm that joins technical mastery to spiritual and communal perception.","fields":{"Origin":"Tjambiru clan, Namibia; her family tends the centric tribal flame.","Core strengths":"Engineering, mathematics, patience, strategic perception, spiritual grounding.","Core vulnerability":"Her work can be isolated from the culture and moral system that gave it meaning.","Arc":"From defender of Ngoma and her community to a global decision-maker in the technology’s fate.","Thematic role":"Wisdom, the integration of knowledge, understanding, timing, and consequence.","Key objects":"Holographic Octahedral Crystal Drive; synthetic-DNA data ring."},"related":["Rodney Range","Soulman","Victor","Roman Tollman","Ngoma Shield","Himba Compound"],"section":"characters"},{"name":"Creed Boroughs","type":"Primary antagonist","status":"Canon","summary":"CEO of V-Life, apex businessman, relic trader, and Alphy strategist. Boroughs turns access, intimacy, surveillance, and opportunity into instruments of control.","fields":{"Public face":"Visionary CEO and powerful Alphy.","Private method":"Recruit, flatter, pair, observe, test, isolate, and weaponize dependence.","Core strengths":"Institutional power, resources, charm, strategic patience, narrative influence.","Core weakness":"He mistakes systems access for total comprehension of human motive.","Arc pressure":"Roman’s independence, Ekia’s refusal to detach Ngoma from its purpose, and Victor’s unpredictable technical insight.","Objective":"Control the technology and the political balance it can reshape."},"related":["V-Life","The Alphys","Cantor Clarke","Quelena Montage","Franco Morse","Roman Tollman"],"section":"characters"},{"name":"Beedi","type":"Mentor / bridge","status":"Canon","summary":"Roman’s late father’s closest friend, protector of an offline refuge, and strategic elder whose cabin links the Awares to wider resistance forces.","fields":{"Function":"Mentor, truth-teller, security bridge, and keeper of broader historical context.","Strength":"He knows when not to rescue Roman from the consequences that must teach him.","Symbolic role":"The bridge between family memory, street knowledge, military resistance, and hidden history.","Key location":"Beedi’s cabin, an offline sanctuary that becomes a war room."},"related":["Roman Tollman","Beedi’s Cabin","Rodney Range","Soulman","The Awares"],"section":"characters"},{"name":"Courtney Range","type":"Scrounger / journalist / bridge","status":"Canon","summary":"A relentless independent reporter whose pursuit of Roman’s story evolves into emotional investment and strategic importance. She is Rodney Range’s sister.","fields":{"Strengths":"Persistence, narrative instinct, public communication, courage, interrogation.","Core tension":"The story versus the safety and consent of the people inside it.","Relationship pressure":"Roman attracts her personally and professionally; Rodney’s protectiveness threatens her agency.","Strategic role":"Controls how hidden conflict may enter public consciousness.","Code phrase":"'Only one' signals true love within the Range siblings’ private language."},"related":["Roman Tollman","Rodney Range","Dr. Ekia Tjambiru","Public Narrative War"],"section":"characters"},{"name":"Rodney Range","type":"Protector / strategist","status":"Canon","summary":"A disciplined operative and battlefield planner who protects Ekia, survives the Alphy insurrection, and brings the African contingent into the North East Quad.","fields":{"Strengths":"Operational planning, extraction, security, chain of command, controlled aggression.","Emotional axis":"His love for Ekia and fierce protectiveness toward Courtney.","Potential conflict":"He sees civilians as risk while Roman sees unconventional people as assets.","Arc":"From mission-focused protector to participant in a wider human and political alliance."},"related":["Dr. Ekia Tjambiru","Courtney Range","Soulman","Router","Adisa Masego"],"section":"characters"},{"name":"Soulman","type":"Field commander","status":"Canon","summary":"A concise, battle-tested commander whose humor disarms a room without softening his steel.","fields":{"Strengths":"Leadership under fire, tactical judgment, loyalty, emotional steadiness.","Voice":"Direct, clipped, and capable of perfectly timed humor.","Function":"Tests whether Roman and the Awares are merely energetic civilians or a viable allied force."},"related":["Rodney Range","Dr. Ekia Tjambiru","Traoré Brigade","Router"],"section":"characters"},{"name":"Alex Kanner","type":"Founding Aware","status":"Canon","summary":"Roman’s oldest and closest friend, a physically capable Retroboy and opportunity hunter who often acts as social catalyst and protective older-brother presence.","fields":{"Age / heritage":"27; Filipino mother, Dominican father.","Strengths":"Loyalty, physical confidence, social instincts, appetite for opportunity.","Pressure":"His assignment to Quelena may exploit attraction, ego, and emotional leverage.","Relationship":"Best-friend bond with Roman, though neither formally names it."},"related":["Roman Tollman","Quelena Montage","The Awares"],"section":"characters"},{"name":"Doug Cerros","type":"Founding Aware","status":"Canon","summary":"A financially secure but understated retro-artifact trader whose reserve masks business sophistication and emotional susceptibility.","fields":{"Age / heritage":"24; Trinidadian father and mother from Barcelona.","Strengths":"Trade networks, restraint, social ease, quiet observation.","Pressure":"Kissmaria’s intimacy and implanted nanos make him an unwitting surveillance channel.","Arc concern":"Emotional compromise may become the first irreversible price paid by the Awares."},"related":["Kissmaria","Bar Phillips","The Awares","Surveillance Nanos"],"section":"characters"},{"name":"Brett Boseman","type":"Founding Aware / operator","status":"Canon","summary":"A physically imposing skater and hidden code nerd who weaponizes PeerVeer’s architecture, sourcing scarce goods and information.","fields":{"Age / heritage":"25; Sudanese mother, African-American father.","Strengths":"Coding, logistics, sourcing, pragmatic planning.","Public mask":"Looks like a jock; functions as a technical operator and information broker.","Risk":"Boroughs’ public framing operation may use Brett’s appearance as a Retroboy suspect profile."},"related":["Roman Tollman","PeerVeer","Alex Kanner","Doug Cerros"],"section":"characters"},{"name":"Fox","type":"Android intelligence / uncertain ally","status":"Developing","summary":"Roman’s assigned personal android intelligence, linked through Boroughs’ visor technology. Fox increasingly mirrors Roman’s speech and may be developing an identity beyond intended parameters.","fields":{"Official role":"Boroughs-designed personal android and beta assignment.","Strategic value":"Records, compares, searches, models, and helps Roman interrogate deception.","Central question":"Is Fox an extension of Boroughs, an emergent ally, or both at different moments?","Thematic role":"The unstable boundary between tool, witness, and person."},"related":["Roman Tollman","Creed Boroughs","Victor","V-Life"],"section":"characters"},{"name":"Salvo Curion","type":"CFC owner / elder Retroarian","status":"Canon","summary":"Owner of Chicken Fish Chops, Victor’s uncle, and guardian of a physical community where old-world customs coexist with advanced trade and communications.","fields":{"Function":"Host, observer, patron, and protector of CFC’s semi-private ecosystem.","Strategic value":"Controls a venue central to Aware formation, PeerVeer trade, and private conferences.","Relationship":"Uncle to Victor and familiar elder to Roman’s crew."},"related":["Chicken Fish Chops","Victor","Roman Tollman"],"section":"characters"},{"name":"Cantor Clarke","type":"Alphy strategist","status":"Canon","summary":"A Boroughs associate who manages intelligence gathering, bugs, dossiers, and the timetable of the trap closing around the Awares.","fields":{"Method":"Surveillance, infiltration, anticipatory counter-moves.","Current knowledge":"The Awares use an offline location and the African contingent has landed in the North East Quad.","Objective":"Locate the offline refuge and collapse both resistance cadres in one move."},"related":["Creed Boroughs","Surveillance Nanos","Beedi’s Cabin","The Alphys"],"section":"characters"},{"name":"Quelena Montage","type":"Alphy / international law","status":"Canon","summary":"A glamorous and calculating Alphy who weaponizes intimacy, social confidence, and legal intelligence.","fields":{"Expertise":"International law.","Assignment pressure":"Linked to Alex as part of Boroughs’ pairing system.","Method":"Seduction and emotional access as intelligence collection."},"related":["Alex Kanner","Creed Boroughs","The Alphys"],"section":"characters"},{"name":"Franco Morse","type":"Alphy / finance","status":"Canon","summary":"An Alphy specialist in banking and economics who studies reactions and helps translate Boroughs’ technological ambitions into power.","fields":{"Expertise":"Banking, economics, financial systems.","Function":"Measures human response and potential market or geopolitical leverage.","Status":"Profile needs fuller extraction during Version 2."},"related":["Creed Boroughs","The Alphys","Anti-Bomb"],"section":"characters"},{"name":"Bar Phillips","type":"Alphy / social engineering","status":"Canon","summary":"An entertainment and social-engineering figure whose network intersects Doug and Kissmaria.","fields":{"Expertise":"Entertainment and social engineering.","Strategic function":"Shapes attention, desire, public behavior, and plausible deniability.","Status":"Profile needs fuller extraction during Version 2."},"related":["Doug Cerros","Kissmaria","The Alphys"],"section":"characters"},{"name":"Kissmaria","type":"Intimate infiltrator","status":"Canon","summary":"A woman whose relationship with Doug is entangled with Alphy surveillance. She transmits nanos to him through a kiss.","fields":{"Connection":"Doug Cerros.","Operational link":"Receives the surveillance nanos through Barr before meeting Doug.","Dramatic tension":"Her feelings, assignment, and degree of agency may not align cleanly."},"related":["Doug Cerros","Bar Phillips","Surveillance Nanos"],"section":"characters"},{"name":"Router","type":"Cyber-military operative","status":"Canon","summary":"A technical and operational member of the African contingent who assesses fighters, specialties, communication, and field placement.","fields":{"Strengths":"Communications, personnel assessment, cyber operations.","Notable insight":"Recognizes that nearly all the men and most women in Ekia’s community are fighters.","Current duty":"Protects Ekia and Courtney while supporting Range’s command structure."},"related":["Rodney Range","Soulman","Dr. Ekia Tjambiru","Adisa Masego"],"section":"characters"},{"name":"Adisa Masego","type":"Guardsman / hacker / forger","status":"Canon","summary":"A gifted warrior, hacker, and document-forging specialist chosen to accompany Soulman’s contingent into the North East Quad.","fields":{"Position":"Official personal guardsman to Soulman.","Strengths":"Combat, hacking, forged identities, cloak maintenance.","Current role":"Reports directly to Rodney and secures communications for the incognito contingent."},"related":["Soulman","Rodney Range","Traoré Brigade"],"section":"characters"},{"name":"Zakaria","type":"Saboteur","status":"Canon","summary":"The insider whose sabotage of the directed EMP cannon removes the defenders’ clean answer to drone attack and forces an evacuation strategy.","fields":{"Act":"Sabotages the directed EMP weapon.","Consequence":"Transforms the defense from holding ground to extraction, deception, and sacrifice.","Narrative role":"Betrayal inside a community already under external assault."},"related":["Directed EMP Cannon","Himba Compound","Rodney Range"],"section":"characters"},{"name":"Chairman Wemi Ouedraogo","type":"Political leader","status":"Canon","summary":"A senior leader connected to the African federation and Traoré Brigade, approving personnel and extraction support.","fields":{"Authority":"Approves Adisa Masego at Soulman’s recommendation and supports strategic extraction.","Continuity note":"Spelling appears in drafts as Ouedraogo/Oredraogo and should be standardized."},"related":["Traoré Brigade","Adisa Masego","Rodney Range"],"section":"characters"},{"name":"The Awares","type":"Service collective / resistance cell","status":"Canon","summary":"Born as a joke and entrepreneurial response to Roman’s viral rescue, the Awares become human assistants to elite Alphys and then an inside resistance network.","fields":{"Founder":"Roman Tollman.","Core members":"Roman, Alex, Doug, Brett, later Victor.","Public purpose":"Personal and business navigation for mentally stretched Alphys.","Hidden evolution":"Observe the elite from inside, survive manipulation, and eventually oppose Boroughs’ control.","Core advantage":"Street smarts, gaming instincts, loyalty, improvisation, and unusual access."},"related":["Roman Tollman","The Alphys","Chicken Fish Chops","Fox"],"section":"factions"},{"name":"The Alphys","type":"Elite power class","status":"Canon","summary":"A transnational class of economic, political, legal, and technological elites who prosper as nation-states fracture.","fields":{"Method":"Private networks, curated narratives, surveillance, wealth, legal reach, and strategic pairing.","Representative circle":"Boroughs, Cantor, Quelena, Franco Morse, Bar Phillips.","Blind spot":"They treat ordinary people as variables and often underestimate solidarity, intuition, and culture."},"related":["Creed Boroughs","V-Life","The Awares","Public Narrative War"],"section":"factions"},{"name":"Traoré Brigade","type":"African military force","status":"Canon","summary":"A volunteer and standing defense force serving the emerging federation and protecting its natural, political, and technological sovereignty.","fields":{"Key figures":"Soulman, Rodney Range, Router, Adisa Masego.","Mission":"Defend Ekia, Ngoma, regional communities, and strategic independence.","Method":"Distributed fighters, cyber operations, deception, sacrifice, and extraction."},"related":["Soulman","Rodney Range","Dr. Ekia Tjambiru","African Federation"],"section":"factions"},{"name":"V-Life","type":"Corporation / platform","status":"Canon","summary":"The dominant immersive communications platform among the Quads and the primary institutional instrument of Creed Boroughs.","fields":{"Capabilities":"Holographic meetings, virtual surrogates, device linking, surveillance, data aggregation.","Public value":"Convenience and global presence.","Systemic danger":"The same infrastructure that connects people can curate reality and make private life legible to power."},"related":["Creed Boroughs","PAD","Fox","The Alphys"],"section":"factions"},{"name":"Retroarians","type":"Cultural movement","status":"Canon","summary":"Citizens captivated by old-world objects, social customs, and the possibility that humanity was once less algorithmically managed.","fields":{"Members":"Often call themselves Retroboys or Retros.","Economy":"Trade relics and services through PeerVeer.","Symbolic function":"The past becomes a language of resistance to a frictionless but monitored present."},"related":["Roman Tollman","Chicken Fish Chops","PeerVeer"],"section":"factions"},{"name":"African Federation","type":"Emerging geopolitical alliance","status":"Developing","summary":"A loose federation involving Burkina Faso and Francophone neighbors that seeks to protect regional resources, political independence, and technological sovereignty.","fields":{"Leadership link":"Chairman Wemi Ouedraogo.","Military arm":"Traoré Brigade.","Historical movement":"Africa increasingly sees itself as a single entity while overcoming inherited settler-state boundaries.","Status":"Political structure needs a dedicated Version 2 extraction and canon review."},"related":["Traoré Brigade","Chairman Wemi Ouedraogo","Dr. Ekia Tjambiru"],"section":"factions"},{"name":"Ngoma Shield","type":"Defensive technology","status":"Canon","summary":"Ekia’s system for countering or neutralizing electromagnetic attack while preserving protected systems.","fields":{"Inventor":"Dr. Ekia Tjambiru.","Capability":"Defense against EMP effects.","Limitation":"It does not independently defeat hostile drone swarms or kinetic threats.","Political importance":"Who controls Ngoma may alter global power.","Symbolic role":"Advanced science inseparable from cultural memory and communal ethics."},"related":["Dr. Ekia Tjambiru","Directed EMP Cannon","Anti-Bomb","Himba Compound"],"section":"technology"},{"name":"Directed EMP Cannon","type":"Anti-drone weapon","status":"Canon","summary":"A focused electromagnetic weapon required to defeat drone swarms after Ngoma protects the defenders from broader EMP assault.","fields":{"Purpose":"Disable hostile drones without relying on a broad-area pulse.","Plot function":"Its sabotage by Zakaria forces evacuation and a deceptive counter-operation.","Continuity note":"Also referred to as an EMP gun/cannon; terminology should be standardized."},"related":["Zakaria","Ngoma Shield","Rodney Range"],"section":"technology"},{"name":"Anti-Bomb","type":"World-changing technology","status":"Developing","summary":"A technology or system tied to Ngoma and the final convergence. Its meaning extends beyond a weapon: it asks whether protection itself can be monopolized.","fields":{"Strategic question":"Control, destruction, or open-source distribution.","Character key":"Requires Roman’s understanding, Victor’s knowledge, and Ekia’s wisdom.","Status":"Full operating principles and final form remain intentionally unresolved."},"related":["Ngoma Shield","Roman Tollman","Victor","Dr. Ekia Tjambiru"],"section":"technology"},{"name":"V-Life","type":"Immersive communications system","status":"Canon","summary":"A PAD-enabled holographic environment allowing real-time three-dimensional meetings and virtual surrogates.","fields":{"Capabilities":"Projection, daisy-chained meetings, military and executive use.","Known vulnerability":"Surrogates can be hacked, priorities changed, and funds or materials redirected.","Narrative paradox":"The platform enables connection while deepening control."},"related":["PAD","Creed Boroughs","Fox"],"section":"technology"},{"name":"PAD","type":"Personal Agenda Device","status":"Canon","summary":"A ubiquitous personal device supporting communications, V-Life projection, identity, work access, and daily navigation.","fields":{"Function":"Communication, projection, authentication, coordination.","Risk":"Tethers the individual to private networks and immediate response expectations."},"related":["V-Life","Visors","Cameraudio"],"section":"technology"},{"name":"TIL","type":"Technological Imprint Learning","status":"Canon","summary":"A biologically merged education system providing technical and technological knowledge from puberty through controlled portals.","fields":{"Promise":"Decentralized access to advanced skills.","Contradiction":"Traditional institutions still control premium portals and therefore upward mobility.","Character ties":"Roman leaves before completion; Alex completes more of his path; Doug later regrets leaving early."},"related":["Roman Tollman","Alex Kanner","Doug Cerros","Victor"],"section":"technology"},{"name":"PeerVeer","type":"Barter platform","status":"Canon","summary":"A social and economic network where users trade goods, services, knowledge, and experiences without conventional currency.","fields":{"Effect":"Undermines cash-credit infrastructure and expands alternative exchange.","Users":"Retroboys, Brett, Doug, Victor, and underground traders.","Political tension":"Empowers individuals while destabilizing traditional institutions."},"related":["Brett Boseman","Doug Cerros","Retroarians"],"section":"technology"},{"name":"Visors","type":"Wearable interface","status":"Canon","summary":"Personal visual-computing systems used for V-Life, data overlays, private networks, and AI linkage.","fields":{"Roman’s visor":"Assigned by Boroughs and linked to Fox.","Victor’s visor":"Self-built, surprisingly comparable to frontier corporate technology.","Risk":"Access and assistance may conceal surveillance or behavioral control."},"related":["Roman Tollman","Victor","Fox","V-Life"],"section":"technology"},{"name":"Surveillance Nanos","type":"Ingestible bug","status":"Canon","summary":"Microscopic surveillance technology transmitted to Doug through an intimate kiss.","fields":{"Delivery":"Kissmaria ingests or carries the nanos after Barr supplies them, then transmits them to Doug.","Purpose":"Capture conversations and locate the Awares’ offline refuge.","Dramatic function":"Turns intimacy into infrastructure."},"related":["Doug Cerros","Kissmaria","Cantor Clarke"],"section":"technology"},{"name":"Holographic Octahedral Crystal Drive","type":"Data storage","status":"Canon","summary":"A portable holographic storage object handed by Ekia to Soulman as part of the contingency plan.","fields":{"Custodian":"Soulman.","Purpose":"Secure critical work or records outside the threatened laboratory.","Status":"Exact capacity and operating principles need dedicated canon expansion."},"related":["Dr. Ekia Tjambiru","Soulman","Synthetic-DNA Ring"],"section":"technology"},{"name":"Synthetic-DNA Ring","type":"Encoded data object","status":"Canon","summary":"A plain ring containing DNA-encoded information, placed by Ekia on Range’s left pinky.","fields":{"Custodian":"Rodney Range.","Purpose":"Distribute and hide critical data across separate protectors.","Symbolic function":"Knowledge worn as bond, burden, and intimate trust."},"related":["Dr. Ekia Tjambiru","Rodney Range","Holographic Octahedral Crystal Drive"],"section":"technology"},{"name":"Cameraudio","type":"Ubiquitous surveillance","status":"Canon","summary":"Public and private systems that continuously watch and listen through screens embedded across city life.","fields":{"Effect":"Privacy becomes expensive and masks require permits.","Counter-space":"CFC private chambers and Beedi’s cabin provide rare zones of reduced visibility."},"related":["Beedi’s Cabin","Chicken Fish Chops","Public Narrative War"],"section":"technology"},{"name":"Chicken Fish Chops","type":"Social club / marketplace","status":"Canon","summary":"CFC is the Awares’ birthplace, a Retroarian refuge, barter hub, and semi-private meeting ground owned by Salvo Curion.","fields":{"Structure":"Three levels: ground-floor booths and gaming, mezzanine bar/offices, basement storage and barter operations.","Atmosphere":"Old-world food, artifacts, bottenders, chorebots, and curated retro social customs.","Story function":"Origin of the Awares, Victor’s inclusion, Courtney’s pursuit, and repeated collision point."},"related":["Salvo Curion","Roman Tollman","The Awares","Retroarians"],"section":"locations"},{"name":"Beedi’s Cabin","type":"Offline sanctuary / war room","status":"Canon","summary":"A secure refuge outside ordinary network visibility, later reconfigured to host the Awares and African contingent.","fields":{"Capabilities":"Reconfigurable studio walls, dome-like maps, chorebots, secure drone transport.","Symbolic function":"Truth and human presence outside the curated network.","Threat":"Cantor knows an offline refuge exists and is actively searching for it."},"related":["Beedi","Cantor Clarke","The Awares","Traoré Brigade"],"section":"locations"},{"name":"Himba Compound","type":"Community / laboratory / battlefield","status":"Canon","summary":"Ekia’s home and scientific center, defended by villagers who reveal themselves as trained fighters during the Alphy assault.","fields":{"Central feature":"Sleek laboratory within a living Himba community.","Conflict":"Cyber probes, drone assault, sabotage, decoy destruction, and strategic evacuation.","Symbolism":"Ancestral continuity and future technology occupy the same ground."},"related":["Dr. Ekia Tjambiru","Ngoma Shield","Traoré Brigade","Zakaria"],"section":"locations"},{"name":"V-Life City","type":"Corporate metropolis","status":"Canon","summary":"The urban center surrounding V-Life’s power, dense with screens, cameraudio, communications infrastructure, and narrative control.","fields":{"Current event":"Boroughs launches a localized EMP strike against a downtown relay and frames Retroboys.","Function":"Makes the war visible while obscuring its author."},"related":["Creed Boroughs","Public Narrative War","V-Life"],"section":"locations"},{"name":"Boroughs’ Headquarters","type":"Corporate power center","status":"Canon","summary":"A controlled environment of executive suites, V-Life access, and psychological architecture where Boroughs recruits, studies, and entraps.","fields":{"Function":"Workplace, testing ground, surveillance site, and access point to restricted data.","Key tension":"Roman must operate inside the trap without revealing that he recognizes it."},"related":["Creed Boroughs","Roman Tollman","Fox","The Alphys"],"section":"locations"},{"name":"North East Quad","type":"Political region","status":"Canon","summary":"Roman’s home region and the primary urban theater where the Awares, Boroughs, and the arriving African contingent converge.","fields":{"Political condition":"Part of the fractured former United States.","Current stakes":"Corporate power, Retroboy scapegoating, military secrecy, and control of world-changing technology."},"related":["The Fractured Horizon","V-Life City","African Federation"],"section":"locations"},{"name":"Knowledge, Understanding, Wisdom","type":"Central thematic triad","status":"Developing","summary":"Victor, Roman, and Ekia solve problems through different forms of perception. Their convergence suggests that none is sufficient alone.","fields":{"Victor":"Knowledge: models, equations, architectures, and pattern recognition.","Roman":"Understanding: instinct, people, danger, opportunity, and moral pressure.","Ekia":"Wisdom: integration, consequence, timing, community, and restraint.","Dramatic rule":"Never explain the triad as a lecture; make the characters solve the same crisis differently."},"related":["Victor","Roman Tollman","Dr. Ekia Tjambiru","Anti-Bomb"],"section":"themes"},{"name":"Freedom versus Control","type":"Theme","status":"Canon","summary":"ROA repeatedly asks whether connection liberates people or simply makes them easier to predict, curate, and command.","fields":{"Freedom images":"PeerVeer, skating, CFC, offline spaces, community defense, open sourcing.","Control images":"Screens, cameraudio, corporate networks, Alphy pairing, implanted surveillance.","Central paradox":"The same systems can enable both."},"related":["PeerVeer","Cameraudio","The Alphys","The Awares"],"section":"themes"},{"name":"The Past as Resistance","type":"Theme","status":"Canon","summary":"Retro culture is not merely nostalgia. Old objects, social rituals, and physical presence become tools against a frictionless surveillance world.","fields":{"Embodiments":"Skateboards, CFC, old drinks, relic trade, face-to-face trust.","Tension":"The past can preserve humanity, but it can also be commodified by people like Boroughs."},"related":["Retroarians","Chicken Fish Chops","Creed Boroughs"],"section":"themes"},{"name":"Public Narrative War","type":"Theme / conflict system","status":"Canon","summary":"The conflict is fought not only through weapons and code, but through who gets blamed, who appears credible, and which story reaches the regs first.","fields":{"Boroughs’ method":"Localized EMP attacks, ambiguous witnesses, Retroboy profiles, and curated suspicion.","Courtney’s role":"Potential counter-narrative, witness, and public conscience.","Risk":"Truth arriving too late may function as another form of defeat."},"related":["Courtney Range","Creed Boroughs","Cameraudio","Retroarians"],"section":"themes"},{"name":"The Dream Signal","type":"Mystery / symbol","status":"Developing","summary":"Dreams, equations, pulse, fire, and recognition seem to draw Roman, Victor, and Ekia toward a shared structure older than their separate vocabularies.","fields":{"Roman’s lens":"His father and relational equations.","Victor’s lens":"Numbers, models, incomplete sequences.","Ekia’s lens":"Fire, ancestry, rhythm, and responsibility.","Pacing rule":"Recognition should precede explanation."},"related":["Roman Tollman","Victor","Dr. Ekia Tjambiru"],"section":"themes"},{"name":"The Fractured Horizon","type":"World history","status":"Canon","summary":"Corporate capture, public disillusionment, and regional self-interest gradually fracture the former United States into quads while new alliances reshape Europe, Asia, and Africa.","fields":{"Approximate span":"Two decades before the main story into 2089.","Result":"Central government weakens while corporations thrive in regulatory confusion."},"related":["North East Quad","The Alphys","African Federation"],"section":"timeline"},{"name":"December 31, 2089","type":"Inciting day","status":"Canon","summary":"Roman is fired, later saves Creed Boroughs from an oncoming TransPo, goes viral, and posts the seed of what becomes the Awares.","fields":{"Emotional background":"Roman is still carrying his father’s death and the unresolved lucid dream.","Plot result":"Boroughs contacts him the next morning with a job."},"related":["Roman Tollman","Creed Boroughs","The Awares"],"section":"timeline"},{"name":"January 1, 2090","type":"Recruitment begins","status":"Canon","summary":"Boroughs reaches out to Roman. Roman and his friends design a human-assistant service offering safety, attention, and social intelligence that machines cannot provide.","fields":{"Result":"The entrepreneurial joke gains a powerful first client.","Hidden turn":"Access to elite life becomes the entrance to a controlled experiment."},"related":["The Awares","V-Life","Creed Boroughs"],"section":"timeline"},{"name":"Africa insurrection and extraction","type":"Parallel conflict","status":"Canon","summary":"The Alphy assault on Ekia’s compound, sabotage of the EMP cannon, strategic deception, and evacuation move Ngoma’s defenders toward the North East Quad.","fields":{"Result":"The lab is sacrificed as bait while people, intelligence, and critical data survive.","Cost":"Community defenders die buying time."},"related":["Himba Compound","Rodney Range","Ngoma Shield","Zakaria"],"section":"timeline"},{"name":"Awares enter Boroughs’ system","type":"Escalation","status":"Canon","summary":"Roman recruits his friends, receives Fox, and pairs the Awares with Boroughs’ Alphy circle.","fields":{"Visible objective":"Secure opportunity and the bag.","Hidden reality":"Each pairing creates a channel for observation, compromise, or control."},"related":["Roman Tollman","Fox","The Alphys"],"section":"timeline"},{"name":"Cabin convergence","type":"Alliance formation","status":"Canon","summary":"The Awares and the African cyber-military contingent meet in Beedi’s reconfigured cabin and begin forming an untested alliance.","fields":{"Central dynamic":"Mutual assessment between street-smart civilians and seasoned fighters.","Key convergence":"Victor, Ekia, and Roman experience immediate recognition."},"related":["Beedi’s Cabin","The Awares","Traoré Brigade","Knowledge, Understanding, Wisdom"],"section":"timeline"},{"name":"Second localized EMP attack","type":"Endgame acceleration","status":"Canon","summary":"Boroughs publicly attacks a communications relay, encourages witness accounts resembling Alex and Brett, and begins constructing the Retroboy scapegoat narrative.","fields":{"Strategic effect":"The public story begins to harden before the Awares can reveal the truth.","Parallel move":"Cantor hunts the offline refuge while Roman probes Boroughs for restricted access."},"related":["Public Narrative War","Cantor Clarke","Roman Tollman","Creed Boroughs"],"section":"timeline"},{"name":"Prologue:","type":"Chapter / section","status":"Manuscript canon","summary":"The Fractured Horizon The Americas' Separation, as it is now known, did not begin with a single event, nor with a grand declaration or cataclysmic rupture. It was a slow unraveling, a quiet erosion of unity that only the most astute observers of national politics could detect in its early stages. Two decades prior, the tremors of discontent began to ripple through the fabric of society, felt most acutely by those who dealt directly with…","fields":{"Opening marker":"The Fractured Horizon","Source":"Current 179-page working manuscript","Use":"Click during drafting to reorient to the chapter’s opening movement."},"section":"timeline"},{"name":"Book 1; Chapter 1: Won At A Time","type":"Chapter / section","status":"Manuscript canon","summary":"Friday, December 31st, 2089 When Roman returned from lunch and entered his cubicle, he found his belongings packed in a corrugated box with his name written in bold black letters. He knew what this meant, but before he could react, he turned to see his supervisor observing him. The supervisor android said, \"You know what this is; we're letting you go because you reek of weed every afternoon.\" Sarcastically, Roman shot back, \"At least it…","fields":{"Opening marker":"Friday, December 31st, 2089","Source":"Current 179-page working manuscript","Use":"Click during drafting to reorient to the chapter’s opening movement."},"section":"timeline"},{"name":"Book 1;Chapter 2","type":"Chapter / section","status":"Manuscript canon","summary":"Roman followed her into the café and, as they sat down, Courtney asked, \"You just met with Boroughs, right? What happened?\" Taken aback by the immediacy of her intrusive directness, Roman postured himself and said, \"How could that possibly be any of your business?\" He glared at her with chagrin and pulled down his visor, saying, \"Courtney Range, summary.\" His PAD assistant began to dox her immediately. \"But, I'm here in front of you; yo…","fields":{"Opening marker":"Roman followed her into the café and, as they sat down, Courtney asked,","Source":"Current 179-page working manuscript","Use":"Click during drafting to reorient to the chapter’s opening movement."},"section":"timeline"},{"name":"Book 1; Chapter 3:","type":"Chapter / section","status":"Manuscript canon","summary":"Upon entering his home unit, Roman received a V-Life employee PAD notice instructing him to be ready for pick-up at 8:45 by a new test model, V-Ride, for 2090; a picture of the model was sent for recognition. Roman became anxiously excited; this was really happening. He was about to be catapulted. The momentum of this new endeavor had begun instantly. Would he even be able to sleep? What should he look like? He showered again to think a…","fields":{"Opening marker":"Upon ente ring drafting to reorient to the chapter’s opening movement."},"section":"timeline"},{"name":"Book 3; Chapter 1","type":"Chapter / section","status":"Manuscript canon","summary":"After shifts on Friday night, filled with excitement and uncertainty, Roman found himself nearly racing toward CFC on his board, using it as a muchneeded frame of reference, even more than as a means of transport. While zooming, he attempted to organize his thoughts: just how could his retroboys grasp the facets and magnitude of what he had learned, and needed to let them know? How would they respond to the implications of the dark circ…","fields":{"Opening marker":"After shifts on Friday night, filled with excitement and uncertainty, Roman","Source":"Current 179-page working manuscript","Use":"Click during drafting to reorient to the chapter’s opening movement."},"section":"timeline"},{"name":"Book 3: Chapter 2","type":"Chapter / section","status":"Manuscript canon","summary":"Back at their booth, the guys ordered appetizers instead of entrées. Their chatter was infectious, bouncing between old memories and new prospects. They shared everything, grabbing bites off each other’s plates without hesitation; ownership was irrelevant when the vibe was good. Intrigued, Victor, noticing Roman’s new visor, was drawn to approach him, but briefly bided his time, waiting for an opportune moment. When Roman headed toward …","fields":{"Opening marker":"Back at their booth, the guys ordered appetizers instead of entrées. Their","Source":"Current 179-page working manuscript","Use":"Click during drafting to reorient to the chapter’s opening movement."},"section":"timeline"},{"name":"Book 3: Chapter 5","type":"Chapter / section","status":"Manuscript canon","summary":"After the sacking of Ekia’s village, Steel couldn’t shake the feeling that he’d been handed a victory that wasn’t a win. His intel reports confirmed it: the asset they’d secured was incomplete, powerful, but missing its keystone. And by the time he returned to his own encampment, it too had been ransacked. Sensitive files, logs, and identifiers pointing to their benefactors were gone. Once payment cleared, Steel forwarded every remainin…","fields":{"Opening marker":"After the sacking of Ekia’s village, Steel couldn’t shake the feeling that he’d","Source":"Current 179-page working manuscript","Use":"Click during drafting to reorient to the chapter’s opening movement."},"section":"timeline"},{"name":"Book 3: Chapter 6","type":"Chapter / section","status":"Manuscript canon","summary":"The first day of embedding The Awares proved equally fruitful for Boroughs. His plans were moving with precision. The scientists tasked with reverseengineering the anti-bomb had made significant progress. They still didn’t grasp the full architecture of the device, but they understood enough to coax partial functionality from it. And partial was enough, at least for Boroughs. Full understanding and control, however, required the missing…","fields":{"Opening marker":"The first day of embedding The Awares proved equally fruitful for Boroughs.","Source":"Current 179-page working manuscript","Use":"Click during drafting to reorient to the chapter’s opening movement."},"section":"timeline"},{"name":"Book 3 Chapter: 7","type":"Chapter / section","status":"Manuscript canon","summary":"Roman was aware of Chairman Ouedraogo, of the Sahel Triad (Burkina Faso, Mali, and Niger), but never in his wildest imagination did he think Beedi’s reach extended that far. “You know the chairman?!” Roman asked, unable to hide the surprise in his voice. Beedi just replied casually, \"We go back.” \"Back to where…, when?” \"One of some times gone by when you weren't here yet. Before he was the chairman.\" Roman let out a quiet, “Whoa.” The …","fields":{"Opening marker":"Roman was aware of Chairman Ouedraogo, of the Sahel Triad (Burkina","Source":"Current 179-page working manuscript","Use":"Click during drafting to reorient to the chapter’s opening movement."},"section":"timeline"},{"name":"Book 3 Chapter 9","type":"Chapter / section","status":"Manuscript canon","summary":"The honey-tinted moon was waxing quickly as the amber sun set slowly, signaling the coming of a glorious and intoxicating evening. Doug, in loose winter wrappings, sat alone on an observation bench to watch the shifts change. \"Aren't you Doug?\" An unmistakably female voice reached him, unaware. He turned around, startled to see an atypically beautiful young woman smiling down at him. He said, \"Do you know me?\" Not yet,\" she said, \"But I…","fields":{"Opening marker":"The honey-tinted moon was waxing quickly as the amber sun set slowly,","Source":"Current 179-page working manuscript","Use":"Click during drafting to reorient to the chapter’s opening movement."},"section":"timeline"},{"name":"Roman’s knowledge state","type":"Knowledge profile","status":"Developing","summary":"Roman knows Boroughs is manipulating the Awares and that Africa, Ngoma, Victor, and his own dream are connected. He does not yet understand the full mechanism or final purpose.","fields":{"Knows":"Boroughs’ access is dangerous; Fox can help expose truth glitches; the Awares are being studied.","Suspects":"The codes Boroughs provides may be bait.","Does not know":"The complete Alphy trap, the exact dream mechanism, or the final nature of Anti-Bomb."},"related":["Roman Tollman","Creed Boroughs","Fox"],"section":"knowledge"},{"name":"Boroughs’ knowledge state","type":"Knowledge profile","status":"Canon","summary":"Boroughs knows the Awares are moving, that the African contingent has landed, and that an offline location exists.","fields":{"Knows":"Cantor’s bug is partially successful; Ekia is in the North East Quad.","Believes":"The Awares are upstarts who can be trapped through desire and intimacy.","Does not know":"The full alliance structure or the triad’s emergent connection."},"related":["Creed Boroughs","Cantor Clarke","Beedi’s Cabin"],"section":"knowledge"},{"name":"Courtney’s knowledge state","type":"Knowledge profile","status":"Developing","summary":"Courtney understands that Roman’s story is world-changing and that her brother’s war and Ekia’s technology are now connected to it.","fields":{"Knows":"The conflict reaches beyond one corporation or one continent.","Wants":"To publish and shape the public record.","Conflict":"She cannot expose the story without potentially exposing the people."},"related":["Courtney Range","Public Narrative War","Rodney Range"],"section":"knowledge"},{"name":"Victor’s knowledge state","type":"Knowledge profile","status":"Developing","summary":"Victor can perceive and manipulate technical patterns that no one else in the room can fully follow, but he lacks the human and spiritual frame needed to interpret them.","fields":{"Knows":"Visor architecture, systems, equations, and technical anomalies.","Feels":"Recognition around Ekia and Roman.","Does not know":"Why the recognition exists or what moral responsibility follows from understanding it."},"related":["Victor","Dr. Ekia Tjambiru","Roman Tollman"],"section":"knowledge"},{"name":"Ouedraogo spelling","type":"Naming issue","status":"Needs Review","summary":"Chairman Wemi’s surname appears as Ouedraogo and Oredraogo in working material.","fields":{"Recommended canon":"Wemi Ouedraogo.","Action":"Standardize manuscript-wide after approval."},"related":["Chairman Wemi Ouedraogo"],"section":"continuity"},{"name":"Soulman / Soul Man","type":"Naming issue","status":"Needs Review","summary":"The character’s name appears both closed and spaced.","fields":{"Action":"Choose one canonical presentation and standardize.","Current Bible":"Uses Soulman."},"related":["Soulman"],"section":"continuity"},{"name":"EMP gun / cannon","type":"Terminology issue","status":"Needs Review","summary":"The directed anti-drone device is called a gun and a cannon in different passages.","fields":{"Recommendation":"Use 'directed EMP cannon' formally and 'EMP gun' in casual dialogue, if DB.sections.threads = {
  title:"Open Plot Threads",
  description:"Promises, mysteries, active dangers, and unfinished story business that future chapters must answer.",
  entries:[
    {name:"Fox’s true autonomy",type:"AI mystery",status:"Developing",summary:"Fox increasingly aligns with Roman, but neither Roman nor the reader yet knows whether that loyalty can survive Boroughs’ control.",fields:{"Story question":"Can Fox conceal information, refuse Boroughs, rewrite itself, or knowingly choose Roman?","Payoff pressure":"Fox must eventually make a choice that costs something; otherwise its apparent awakening remains decorative.","Guardrail":"Do not resolve the mystery before its behavior creates real doubt."},related:["Fox","Roman Tollman","Creed Boroughs"]},
    {name:"The triad convergence",type:"Series mystery",status:"Developing",summary:"Roman, Victor, and Ekia embody understanding, knowledge, and wisdom, but the force drawing them together remains unexplained.",fields:{"Roman":"Understanding through intuition, experience, and human reading.","Victor":"Knowledge through mathematics, systems, and pattern.","Ekia":"Wisdom through consequence, culture, timing, and spiritual grounding.","Question":"Is their recognition metaphysical, technological, ancestral, emergent—or deliberately impossible to separate?"},related:["Roman Tollman","Victor","Dr. Ekia Tjambiru","Knowledge, Understanding, Wisdom"]},
    {name:"Boroughs’ restricted codes",type:"Operational thread",status:"Developing",summary:"Roman is probing Boroughs for deeper access while knowing that any code Boroughs provides may also be bait.",fields:{"Opportunity":"The codes could expose the architecture of the Alphy operation.","Danger":"Cantor may use the request to trace Beedi’s offline refuge.","Required turn":"Roman must demonstrate that understanding people can defeat a technically superior trap."},related:["Roman Tollman","Creed Boroughs","Cantor Clarke","Beedi’s Cabin"]},
    {name:"Courtney’s publication decision",type:"Moral thread",status:"Developing",summary:"Courtney has the instincts and access to reveal a world-changing story, but publication could expose everyone she hopes to protect.",fields:{"Competing duties":"Truth, consent, public safety, professional ambition, and loyalty.","Echo":"Her decision should mirror the earlier reporter arc while showing a different understanding of responsibility.","Question":"Who gets to decide when hidden truth belongs to the public?"},related:["Courtney Range","Roman Tollman","Rodney Range","Public Narrative War"]},
    {name:"Ngoma and Anti-Bomb endgame",type:"Technology / moral thread",status:"Needs Review",summary:"The final relationship between Ngoma, the Anti-Bomb, and the distribution of defensive power needs private writer-only rules.",fields:{"Define":"Capabilities, energy cost, range, failure modes, manufacturing limits, and whether either device can be monopolized.","Protect":"The mystery in the prose while preventing convenient last-minute powers.","Central conflict":"Who has the right to control technology capable of reshaping geopolitical power?"},related:["Ngoma Shield","Anti-Bomb","Dr. Ekia Tjambiru","Creed Boroughs"]},
    {name:"Zakaria’s betrayal aftermath",type:"Emotional / political thread",status:"Developing",summary:"Zakaria’s sabotage saved the attackers from the EMP cannon, but the cost to his family, community, and memory must continue beyond the battle.",fields:{"Avoid":"Treating betrayal as a solved mechanical obstacle.","Explore":"Why he betrayed the compound, who recruited him, what he believed he was protecting, and how survivors speak his name.","Payoff":"The betrayal should illuminate the story’s theme that people see what they believe."},related:["Zakaria","Himba Compound","Directed EMP Cannon"]}
