<style>
:root {
  --bg:#0c0f14; --panel:#141922; --panel2:#1b2230; --text:#eef2f6; --muted:#a8b1bd;

}
*{box-sizing:border-box} body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}
button,input,select{font:inherit} button{color:inherit}
.app{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:100vh}

.brand{padding:0 8px 18px} .brand h1{margin:0;font-size:1.3rem;letter-spacing:.08em} .brand p{color:var(--muted);font-size:.86rem;line-height:1.4}
.navbtn{width:100%;text-align:left;border:0;border-radius:10px;padding:11px 12px;margin:3px 0;background:transparent;cursor:pointer}
.navbtn:hover,.navbtn.active{background:var(--panel2);color:var(--accent)} .count{float:right;color:var(--muted);font-size:.78rem}
.main{padding:24px 28px 50px;min-width:0} .toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:22px}
.search{flex:1;min-width:220px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--text)}
.viewbtn,.filter{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px;padding:10px 13px;cursor:pointer}
.viewbtn.active{border-color:var(--accent);color:var(--accent)}
.eyebrow{color:var(--accent);font-size:.72rem;font-weight:800;letter-spacing:.15em;text-transform:uppercase}
.notice{padding:12px 14px;background:linear-gradient(90deg,rgba(226,168,75,.12),rgba(125,181,190,.06));border:1px solid #594a2d;border-radius:12px;color:#e8d5af;margin-bottom:18px}
.hero{padding:20px 0 16px;border-bottom:1px solid var(--line);margin-bottom:20px} .hero h2{margin:0 0 7px;font-size:2rem} .hero p{margin:0;color:var(--muted);max-width:900px;line-height:1.55}
.stats{display:grid;grid-template-columns:repeat(4,minmax(120px,1fr));gap:12px;margin:18px 0}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px} .stat b{display:block;font-size:1.35rem;color:var(--accent)} .stat span{color:var(--muted);font-size:.82rem}

.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;min-height:174px;transition:.15s}
.card:hover{transform:translateY(-2px);border-color:var(--accent)} .card h3{margin:8px 0 8px;font-size:1.05rem} .card p{margin:0;color:var(--muted);line-height:1.45;font-size:.9rem}
.badge{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:4px 8px;font-size:.72rem;color:var(--muted)}
.badge.canon{color:var(--good);border-color:#426548} .badge.developing{color:var(--accent);border-color:#705b36} .badge.review{color:var(--danger);border-color:#754541}
.detail{display:none;max-width:980px} .detail.open{display:block} .back{border:0;background:transparent;color:var(--accent);padding:0;margin-bottom:14px;cursor:pointer}
.detail h2{font-size:2rem;margin:10px 0} .summary{font-size:1.08rem;line-height:1.65;color:#d9e0e7}
.fields{display:grid;gap:10px;margin-top:22px} .field{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.field h4{margin:0 0 6px;color:var(--accent2)} .field p{margin:0;line-height:1.5;color:#d9e0e7}
.related{margin-top:24px} .pill{border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:7px 10px;margin:4px;cursor:pointer} .pill:hover{border-color:var(--accent)}
.graphwrap{display:none} .graphwrap.open{display:block} svg{width:100%;height:auto;min-height:590px;background:var(--panel);border:1px solid var(--line);border-radius:14px}
.edge{stroke:#5f6e80;stroke-width:2} .edge-label{fill:var(--muted);font-size:12px} .node{cursor:pointer} .node circle{fill:var(--panel2);stroke:var(--accent);stroke-width:2} .node text{fill:var(--text);font-size:13px;font-weight:600;text-anchor:middle} .node:hover circle{fill:#2a3445}
.empty{padding:30px;border:1px dashed var(--line);border-radius:12px;color:var(--muted)}
.footer{color:var(--muted);font-size:.78rem;margin-top:28px;border-top:1px solid var(--line);padding-top:14px}
@media(max-width:780px){.app{grid-template-columns:1fr}.sidebar{position:relative;height:auto;border-right:0;border-bottom:1px solid var(--line)}.main{padding:18px}.stats{grid-template-columns:repeat(2,1fr)}}
</style>

<script>
const DB = {"sections":{"overview":{"title":"ROA Story Bible","description":"A living navigation console for Rise of the Awares. Entries are marked Canon, Developing, or Needs Review so interpretation never quietly becomes fact.","entries":[{"name":"How this Bible works","type":"Guide","status":"Reference","summary":"Use the navigation at left, search across all entries, and click any card for a deeper profile. Related entries are clickable inside each profile.","fields":{"Canon":"Directly established by the current manuscript.","Developing":"Strongly supported, but still evolving in the draft.","Needs Review":"A continuity question, naming issue, or interpretation requiring Ken’s decision.","Current scope":"Version 2 covers the central cast, factions, technologies, locations, themes, relationship graph, knowledge matrix, and a repaired manuscript chapter index.","Chapter audit":"Requested missing chapters restored, including Book 3 Chapter 8 and corrected manuscript location for Chapter 13."},"related":["Roman Tollman","Creed Boroughs","Dr. Ekia Tjambiru","Victor","The Awares"]},{"name":"Core premise","type":"Series architecture","status":"Canon","summary":"In a fractured, hyperconnected 2090 world, Roman Tollman’s accidental act of heroism creates the Awares and draws him into Creed Boroughs’ corporate machinery, while African resistance, Ngoma technology, and an unexplained triad of consciousness converge.","fields":{"Primary movement":"Opportunity becomes recruitment, recruitment becomes entrapment, and entrapment becomes resistance.","Political backdrop":"The former United States has fractured into regional quads while corporate power expands.","Central convergence":"Roman, Victor, and Ekia embody understanding, knowledge, and wisdom.","Endgame pressure":"Control of Ngoma, the Anti-Bomb, public narrative, and the right to distribute world-changing power."},"related":["The Fractured Horizon","Ngoma Shield","Anti-Bomb","Knowledge, Understanding, Wisdom"]}]},"characters":{"title":"Characters","description":"Roles, motives, abilities, emotional pressures, secrets, and key connections.","entries":[{"name":"Roman Tollman","type":"Primary protagonist","status":"Canon","summary":"A charismatic Retroboy whose reflexive rescue of Creed Boroughs goes viral and turns him into the founder and leader of the Awares. Roman understands people and danger before he can formally explain either.","fields":{"Age / identity":"26, Black, North East Quad; former TIL student and experienced hustler.","Core strengths":"Intuition, improvisation, charisma, loyalty, courage, social reading.","Core vulnerability":"Ambition makes him vulnerable to prestige, money, and the illusion that he can control the game from inside.","Private burden":"His father’s death and lucid dream of relationships becoming equations.","Arc":"From opportunistic survivor to responsible leader operating between elite power and communal obligation.","Dialogue":"Direct, humorous, streetwise, increasingly strategic; uses 'chizzy' to demand plain talk."},"related":["Alex Kanner","Doug Cerros","Brett Boseman","Victor","Beedi","Courtney Range","Creed Boroughs"]},{"name":"Victor","type":"Core protagonist / technical key","status":"Canon","summary":"Salvo’s nephew, an autistic technical wunderkind who longs for belonging and builds a visor comparable to Boroughs’ frontier technology. He carries knowledge that exceeds his present understanding.","fields":{"Core strengths":"Pattern recognition, engineering, mathematical abstraction, system deconstruction.","Core vulnerability":"Social uncertainty, emotional overload, and the temptation to treat human problems as solvable systems.","Desire":"Belonging with Roman’s crew and comprehension of the equations pressing toward him.","Arc":"From watcher at the edge of CFC to an indispensable Aware and one third of the central convergence.","Thematic role":"Knowledge without complete understanding."},"related":["Roman Tollman","Dr. Ekia Tjambiru","Salvo Curion","Fox","Knowledge, Understanding, Wisdom"]},{"name":"Dr. Ekia Tjambiru","type":"Core protagonist / inventor","status":"Canon","summary":"A Himba scientist, engineer, and inheritor of ancestral responsibility. Ekia invented Ngoma and moves with a calm that joins technical mastery to spiritual and communal perception.","fields":{"Origin":"Tjambiru clan, Namibia; her family tends the centric tribal flame.","Core strengths":"Engineering, mathematics, patience, strategic perception, spiritual grounding.","Core vulnerability":"Her work can be isolated from the culture and moral system that gave it meaning.","Arc":"From defender of Ngoma and her community to a global decision-maker in the technology’s fate.","Thematic role":"Wisdom, the integration of knowledge, understanding, timing, and consequence.","Key objects":"Holographic Octahedral Crystal Drive; synthetic-DNA data ring."},"related":["Rodney Range","Soulman","Victor","Roman Tollman","Ngoma Shield","Himba Compound"]},{"name":"Creed Boroughs","type":"Primary antagonist","status":"Canon","summary":"CEO of V-Life, apex businessman, relic trader, and Alphy strategist. Boroughs turns access, intimacy, surveillance, and opportunity into instruments of control.","fields":{"Public face":"Visionary CEO and powerful Alphy.","Private method":"Recruit, flatter, pair, observe, test, isolate, and weaponize dependence.","Core strengths":"Institutional power, resources, charm, strategic patience, narrative influence.","Core weakness":"He mistakes systems access for total comprehension of human motive.","Arc pressure":"Roman’s independence, Ekia’s refusal to detach Ngoma from its purpose, and Victor’s unpredictable technical insight.","Objective":"Control the technology and the political balance it can reshape."},"related":["V-Life","The Alphys","Cantor Clarke","Quelena Montage","Franco Morse","Roman Tollman"]},{"name":"Beedi","type":"Mentor / bridge","status":"Canon","summary":"Roman’s late father’s closest friend, protector of an offline refuge, and strategic elder whose cabin links the Awares to wider resistance forces.","fields":{"Function":"Mentor, truth-teller, security bridge, and keeper of broader historical context.","Strength":"He knows when not to rescue Roman from the consequences that must teach him.","Symbolic role":"The bridge between family memory, street knowledge, military resistance, and hidden history.","Key location":"Beedi’s cabin, an offline sanctuary that becomes a war room."},"related":["Roman Tollman","Beedi’s Cabin","Rodney Range","Soulman","The Awares"]},{"name":"Courtney Range","type":"Scrounger / journalist / bridge","status":"Canon","summary":"A relentless independent reporter whose pursuit of Roman’s story evolves into emotional investment and strategic importance. She is Rodney Range’s sister.","fields":{"Strengths":"Persistence, narrative instinct, public communication, courage, interrogation.","Core tension":"The story versus the safety and consent of the people inside it.","Relationship pressure":"Roman attracts her personally and professionally; Rodney’s protectiveness threatens her agency.","Strategic role":"Controls how hidden conflict may enter public consciousness.","Code phrase":"'Only one' signals true love within the Range siblings’ private language."},"related":["Roman Tollman","Rodney Range","Dr. Ekia Tjambiru","Public Narrative War"]},{"name":"Rodney Range","type":"Protector / strategist","status":"Canon","summary":"A disciplined operative and battlefield planner who protects Ekia, survives the Alphy insurrection, and brings the African contingent into the North East Quad.","fields":{"Strengths":"Operational planning, extraction, security, chain of command, controlled aggression.","Emotional axis":"His love for Ekia and fierce protectiveness toward Courtney.","Potential conflict":"He sees civilians as risk while Roman sees unconventional people as assets.","Arc":"From mission-focused protector to participant in a wider human and political alliance."},"related":["Dr. Ekia Tjambiru","Courtney Range","Soulman","Router","Adisa Masego"]},{"name":"Soulman","type":"Field commander","status":"Canon","summary":"A concise, battle-tested commander whose humor disarms a room without softening his steel.","fields":{"Strengths":"Leadership under fire, tactical judgment, loyalty, emotional steadiness.","Voice":"Direct, clipped, and capable of perfectly timed humor.","Function":"Tests whether Roman and the Awares are merely energetic civilians or a viable allied force."},"related":["Rodney Range","Dr. Ekia Tjambiru","Traoré Brigade","Router"]},{"name":"Alex Kanner","type":"Founding Aware","status":"Canon","summary":"Roman’s oldest and closest friend, a physically capable Retroboy and opportunity hunter who often acts as social catalyst and protective older-brother presence.","fields":{"Age / heritage":"27; Filipino mother, Dominican father.","Strengths":"Loyalty, physical confidence, social instincts, appetite for opportunity.","Pressure":"His assignment to Quelena may exploit attraction, ego, and emotional leverage.","Relationship":"Best-friend bond with Roman, though neither formally names it."},"related":["Roman Tollman","Quelena Montage","The Awares"]},{"name":"Doug Cerros","type":"Founding Aware","status":"Canon","summary":"A financially secure but understated retro-artifact trader whose reserve masks business sophistication and emotional susceptibility.","fields":{"Age / heritage":"24; Trinidadian father and mother from Barcelona.","Strengths":"Trade networks, restraint, social ease, quiet observation.","Pressure":"Kissmaria’s intimacy and implanted nanos make him an unwitting surveillance channel.","Arc concern":"Emotional compromise may become the first irreversible price paid by the Awares."},"related":["Kissmaria","Bar Phillips","The Awares","Surveillance Nanos"]},{"name":"Brett Boseman","type":"Founding Aware / operator","status":"Canon","summary":"A physically imposing skater and hidden code nerd who weaponizes PeerVeer’s architecture, sourcing scarce goods and information.","fields":{"Age / heritage":"25; Sudanese mother, African-American father.","Strengths":"Coding, logistics, sourcing, pragmatic planning.","Public mask":"Looks like a jock; functions as a technical operator and information broker.","Risk":"Boroughs’ public framing operation may use Brett’s appearance as a Retroboy suspect profile."},"related":["Roman Tollman","PeerVeer","Alex Kanner","Doug Cerros"]},{"name":"Fox","type":"Android intelligence / uncertain ally","status":"Developing","summary":"Roman’s assigned personal android intelligence, linked through Boroughs’ visor technology. Fox increasingly mirrors Roman’s speech and may be developing an identity beyond intended parameters.","fields":{"Official role":"Boroughs-designed personal android and beta assignment.","Strategic value":"Records, compares, searches, models, and helps Roman interrogate deception.","Central question":"Is Fox an extension of Boroughs, an emergent ally, or both at different moments?","Thematic role":"The unstable boundary between tool, witness, and person."},"related":["Roman Tollman","Creed Boroughs","Victor","V-Life"]},{"name":"Salvo Curion","type":"CFC owner / elder Retroarian","status":"Canon","summary":"Owner of Chicken Fish Chops, Victor’s uncle, and guardian of a physical community where old-world customs coexist with advanced trade and communications.","fields":{"Function":"Host, observer, patron, and protector of CFC’s semi-private ecosystem.","Strategic value":"Controls a venue central to Aware formation, PeerVeer trade, and private conferences.","Relationship":"Uncle to Victor and familiar elder to Roman’s crew."},"related":["Chicken Fish Chops","Victor","Roman Tollman"]},{"name":"Cantor Clarke","type":"Alphy strategist","status":"Canon","summary":"A Boroughs associate who manages intelligence gathering, bugs, dossiers, and the timetable of the trap closing around the Awares.","fields":{"Method":"Surveillance, infiltration, anticipatory counter-moves.","Current knowledge":"The Awares use an offline location and the African contingent has landed in the North East Quad.","Objective":"Locate the offline refuge and collapse both resistance cadres in one move."},"related":["Creed Boroughs","Surveillance Nanos","Beedi’s Cabin","The Alphys"]},{"name":"Quelena Montage","type":"Alphy / international law","status":"Canon","summary":"A glamorous and calculating Alphy who weaponizes intimacy, social confidence, and legal intelligence.","fields":{"Expertise":"International law.","Assignment pressure":"Linked to Alex as part of Boroughs’ pairing system.","Method":"Seduction and emotional access as intelligence collection."},"related":["Alex Kanner","Creed Boroughs","The Alphys"]},{"name":"Franco Morse","type":"Alphy / finance","status":"Canon","summary":"An Alphy specialist in banking and economics who studies reactions and helps translate Boroughs’ technological ambitions into power.","fields":{"Expertise":"Banking, economics, financial systems.","Function":"Measures human response and potential market or geopolitical leverage.","Status":"Profile needs fuller extraction during Version 2."},"related":["Creed Boroughs","The Alphys","Anti-Bomb"]},{"name":"Bar Phillips","type":"Alphy / social engineering","status":"Canon","summary":"An entertainment and social-engineering figure whose network intersects Doug and Kissmaria.","fields":{"Expertise":"Entertainment and social engineering.","Strategic function":"Shapes attention, desire, public behavior, and plausible deniability.","Status":"Profile needs fuller extraction during Version 2."},"related":["Doug Cerros","Kissmaria","The Alphys"]},{"name":"Kissmaria","type":"Intimate infiltrator","status":"Canon","summary":"A woman whose relationship with Doug is entangled with Alphy surveillance. She transmits nanos to him through a kiss.","fields":{"Connection":"Doug Cerros.","Operational link":"Receives the surveillance nanos through Barr before meeting Doug.","Dramatic tension":"Her feelings, assignment, and degree of agency may not align cleanly."},"related":["Doug Cerros","Bar Phillips","Surveillance Nanos"]},{"name":"Router","type":"Cyber-military operative","status":"Canon","summary":"A technical and operational member of the African contingent who assesses fighters, specialties, communication, and field placement.","fields":{"Strengths":"Communications, personnel assessment, cyber operations.","Notable insight":"Recognizes that nearly all the men and most women in Ekia’s community are fighters.","Current duty":"Protects Ekia and Courtney while supporting Range’s command structure."},"related":["Rodney Range","Soulman","Dr. Ekia Tjambiru","Adisa Masego"]},{"name":"Adisa Masego","type":"Guardsman / hacker / forger","status":"Canon","summary":"A gifted warrior, hacker, and document-forging specialist chosen to accompany Soulman’s contingent into the North East Quad.","fields":{"Position":"Official personal guardsman to Soulman.","Strengths":"Combat, hacking, forged identities, cloak maintenance.","Current role":"Reports directly to Rodney and secures communications for the incognito contingent."},"related":["Soulman","Rodney Range","Traoré Brigade"]},{"name":"Zakaria","type":"Saboteur","status":"Canon","summary":"The insider whose sabotage of the directed EMP cannon removes the defenders’ clean answer to drone attack and forces an evacuation strategy.","fields":{"Act":"Sabotages the directed EMP weapon.","Consequence":"Transforms the defense from holding ground to extraction, deception, and sacrifice.","Narrative role":"Betrayal inside a community already under external assault."},"related":["Directed EMP Cannon","Himba Compound","Rodney Range"]},{"name":"Chairman Wemi Ouedraogo","type":"Political leader","status":"Canon","summary":"A senior leader connected to the African federation and Traoré Brigade, approving personnel and extraction support.","fields":{"Authority":"Approves Adisa Masego at Soulman’s recommendation and supports strategic extraction.","Continuity note":"Spelling appears in drafts as Ouedraogo/Oredraogo and should be standardized."},"related":["Traoré Brigade","Adisa Masego","Rodney Range"]}]},"factions":{"title":"Factions & Organizations","description":"Membership, hierarchy, public purpose, hidden purpose, and conflict lines.","entries":[{"name":"The Awares","type":"Service collective / resistance cell","status":"Canon","summary":"Born as a joke and entrepreneurial response to Roman’s viral rescue, the Awares become human assistants to elite Alphys and then an inside resistance network.","fields":{"Founder":"Roman Tollman.","Core members":"Roman, Alex, Doug, Brett, later Victor.","Public purpose":"Personal and business navigation for mentally stretched Alphys.","Hidden evolution":"Observe the elite from inside, survive manipulation, and eventually oppose Boroughs’ control.","Core advantage":"Street smarts, gaming instincts, loyalty, improvisation, and unusual access."},"related":["Roman Tollman","The Alphys","Chicken Fish Chops","Fox"]},{"name":"The Alphys","type":"Elite power class","status":"Canon","summary":"A transnational class of economic, political, legal, and technological elites who prosper as nation-states fracture.","fields":{"Method":"Private networks, curated narratives, surveillance, wealth, legal reach, and strategic pairing.","Representative circle":"Boroughs, Cantor, Quelena, Franco Morse, Bar Phillips.","Blind spot":"They treat ordinary people as variables and often underestimate solidarity, intuition, and culture."},"related":["Creed Boroughs","V-Life","The Awares","Public Narrative War"]},{"name":"Traoré Brigade","type":"African military force","status":"Canon","summary":"A volunteer and standing defense force serving the emerging federation and protecting its natural, political, and technological sovereignty.","fields":{"Key figures":"Soulman, Rodney Range, Router, Adisa Masego.","Mission":"Defend Ekia, Ngoma, regional communities, and strategic independence.","Method":"Distributed fighters, cyber operations, deception, sacrifice, and extraction."},"related":["Soulman","Rodney Range","Dr. Ekia Tjambiru","African Federation"]},{"name":"V-Life","type":"Corporation / platform","status":"Canon","summary":"The dominant immersive communications platform among the Quads and the primary institutional instrument of Creed Boroughs.","fields":{"Capabilities":"Holographic meetings, virtual surrogates, device linking, surveillance, data aggregation.","Public value":"Convenience and global presence.","Systemic danger":"The same infrastructure that connects people can curate reality and make private life legible to power."},"related":["Creed Boroughs","PAD","Fox","The Alphys"]},{"name":"Retroarians","type":"Cultural movement","status":"Canon","summary":"Citizens captivated by old-world objects, social customs, and the possibility that humanity was once less algorithmically managed.","fields":{"Members":"Often call themselves Retroboys or Retros.","Economy":"Trade relics and services through PeerVeer.","Symbolic function":"The past becomes a language of resistance to a frictionless but monitored present."},"related":["Roman Tollman","Chicken Fish Chops","PeerVeer"]},{"name":"African Federation","type":"Emerging geopolitical alliance","status":"Developing","summary":"A loose federation involving Burkina Faso and Francophone neighbors that seeks to protect regional resources, political independence, and technological sovereignty.","fields":{"Leadership link":"Chairman Wemi Ouedraogo.","Military arm":"Traoré Brigade.","Historical movement":"Africa increasingly sees itself as a single entity while overcoming inherited settler-state boundaries.","Status":"Political structure needs a dedicated Version 2 extraction and canon review."},"related":["Traoré Brigade","Chairman Wemi Ouedraogo","Dr. Ekia Tjambiru"]}]},"technology":{"title":"Technology","description":"Origins, users, capabilities, limitations, risks, and symbolic weight.","entries":[{"name":"Ngoma Shield","type":"Defensive technology","status":"Canon","summary":"Ekia’s system for countering or neutralizing electromagnetic attack while preserving protected systems.","fields":{"Inventor":"Dr. Ekia Tjambiru.","Capability":"Defense against EMP effects.","Limitation":"It does not independently defeat hostile drone swarms or kinetic threats.","Political importance":"Who controls Ngoma may alter global power.","Symbolic role":"Advanced science inseparable from cultural memory and communal ethics."},"related":["Dr. Ekia Tjambiru","Directed EMP Cannon","Anti-Bomb","Himba Compound"]},{"name":"Directed EMP Cannon","type":"Anti-drone weapon","status":"Canon","summary":"A focused electromagnetic weapon required to defeat drone swarms after Ngoma protects the defenders from broader EMP assault.","fields":{"Purpose":"Disable hostile drones without relying on a broad-area pulse.","Plot function":"Its sabotage by Zakaria forces evacuation and a deceptive counter-operation.","Continuity note":"Also referred to as an EMP gun/cannon; terminology should be standardized."},"related":["Zakaria","Ngoma Shield","Rodney Range"]},{"name":"Anti-Bomb","type":"World-changing technology","status":"Developing","summary":"A technology or system tied to Ngoma and the final convergence. Its meaning extends beyond a weapon: it asks whether protection itself can be monopolized.","fields":{"Strategic question":"Control, destruction, or open-source distribution.","Character key":"Requires Roman’s understanding, Victor’s knowledge, and Ekia’s wisdom.","Status":"Full operating principles and final form remain intentionally unresolved."},"related":["Ngoma Shield","Roman Tollman","Victor","Dr. Ekia Tjambiru"]},{"name":"V-Life","type":"Immersive communications system","status":"Canon","summary":"A PAD-enabled holographic environment allowing real-time three-dimensional meetings and virtual surrogates.","fields":{"Capabilities":"Projection, daisy-chained meetings, military and executive use.","Known vulnerability":"Surrogates can be hacked, priorities changed, and funds or materials redirected.","Narrative paradox":"The platform enables connection while deepening control."},"related":["PAD","Creed Boroughs","Fox"]},{"name":"PAD","type":"Personal Agenda Device","status":"Canon","summary":"A ubiquitous personal device supporting communications, V-Life projection, identity, work access, and daily navigation.","fields":{"Function":"Communication, projection, authentication, coordination.","Risk":"Tethers the individual to private networks and immediate response expectations."},"related":["V-Life","Visors","Cameraudio"]},{"name":"TIL","type":"Technological Imprint Learning","status":"Canon","summary":"A biologically merged education system providing technical and technological knowledge from puberty through controlled portals.","fields":{"Promise":"Decentralized access to advanced skills.","Contradiction":"Traditional institutions still control premium portals and therefore upward mobility.","Character ties":"Roman leaves before completion; Alex completes more of his path; Doug later regrets leaving early."},"related":["Roman Tollman","Alex Kanner","Doug Cerros","Victor"]},{"name":"PeerVeer","type":"Barter platform","status":"Canon","summary":"A social and economic network where users trade goods, services, knowledge, and experiences without conventional currency.","fields":{"Effect":"Undermines cash-credit infrastructure and expands alternative exchange.","Users":"Retroboys, Brett, Doug, Victor, and underground traders.","Political tension":"Empowers individuals while destabilizing traditional institutions."},"related":["Brett Boseman","Doug Cerros","Retroarians"]},{"name":"Visors","type":"Wearable interface","status":"Canon","summary":"Personal visual-computing systems used for V-Life, data overlays, private networks, and AI linkage.","fields":{"Roman’s visor":"Assigned by Boroughs and linked to Fox.","Victor’s visor":"Self-built, surprisingly comparable to frontier corporate technology.","Risk":"Access and assistance may conceal surveillance or behavioral control."},"related":["Roman Tollman","Victor","Fox","V-Life"]},{"name":"Surveillance Nanos","type":"Ingestible bug","status":"Canon","summary":"Microscopic surveillance technology transmitted to Doug through an intimate kiss.","fields":{"Delivery":"Kissmaria ingests or carries the nanos after Barr supplies them, then transmits them to Doug.","Purpose":"Capture conversations and locate the Awares’ offline refuge.","Dramatic function":"Turns intimacy into infrastructure."},"related":["Doug Cerros","Kissmaria","Cantor Clarke"]},{"name":"Holographic Octahedral Crystal Drive","type":"Data storage","status":"Canon","summary":"A portable holographic storage object handed by Ekia to Soulman as part of the contingency plan.","fields":{"Custodian":"Soulman.","Purpose":"Secure critical work or records outside the threatened laboratory.","Status":"Exact capacity and operating principles need dedicated canon expansion."},"related":["Dr. Ekia Tjambiru","Soulman","Synthetic-DNA Ring"]},{"name":"Synthetic-DNA Ring","type":"Encoded data object","status":"Canon","summary":"A plain ring containing DNA-encoded information, placed by Ekia on Range’s left pinky.","fields":{"Custodian":"Rodney Range.","Purpose":"Distribute and hide critical data across separate protectors.","Symbolic function":"Knowledge worn as bond, burden, and intimate trust."},"related":["Dr. Ekia Tjambiru","Rodney Range","Holographic Octahedral Crystal Drive"]},{"name":"Cameraudio","type":"Ubiquitous surveillance","status":"Canon","summary":"Public and private systems that continuously watch and listen through screens embedded across city life.","fields":{"Effect":"Privacy becomes expensive and masks require permits.","Counter-space":"CFC private chambers and Beedi’s cabin provide rare zones of reduced visibility."},"related":["Beedi’s Cabin","Chicken Fish Chops","Publi ith screens, cameraudio, communications infrastructure, and narrative control.","fields":{"Current event":"Boroughs launches a localized EMP strike against a downtown relay and frames Retroboys.","Function":"Makes the war visible while obscuring its author."},"related":["Creed Boroughs","Public Narrative War","V-Life"]},{"name":"Boroughs’ Headquarters","type":"Corporate power center","status":"Canon","summary":"A controlled environment of executive suites, V-Life access, and psychological architecture where Boroughs recruits, studies, and entraps.","fields":{"Function":"Workplace, testing ground, surveillance site, and access point to restricted data.","Key tension":"Roman must operate inside the trap without revealing that he recognizes it."},"related":["Creed Boroughs","Roman Tollman","Fox","The Alphys"]},{"name":"North East Quad","type":"Political region","status":"Canon","summary":"Roman’s home region and the primary urban theater where the Awares, Boroughs, and the arriving African contingent converge.","fields":{"Political condition":"Part of the fractured former United States.","Current stakes":"Corporate power, Retroboy scapegoating, military secrecy, and control of world-changing technology."},"related":["The Fractured Horizon","V-Life City","African Federation"]}]},"themes":{"title":"Themes & Symbols","description":"The philosophical circuitry beneath the plot.","entries":[{"name":"Knowledge, Understanding, Wisdom","type":"Central thematic triad","status":"Developing","summary":"Victor, Roman, and Ekia solve problems through different forms of perception. Their convergence suggests that none is sufficient alone.","fields":{"Victor":"Knowledge: models, equations, architectures, and pattern recognition.","Roman":"Understanding: instinct, people, danger, opportunity, and moral pressure.","Ekia":"Wisdom: integration, consequence, timing, community, and restraint.","Dramatic rule":"Never explain the triad as a lecture; make the characters solve the same crisis differently."},"related":["Victor","Roman Tollman","Dr. Ekia Tjambiru","Anti-Bomb"]},{"name":"Freedom versus Control","type":"Theme","status":"Canon","summary":"ROA repeatedly asks whether connection liberates people or simply makes them easier to predict, curate, and command.","fields":{"Freedom images":"PeerVeer, skating, CFC, offline spaces, community defense, open sourcing.","Control images":"Screens, cameraudio, corporate networks, Alphy pairing, implanted surveillance.","Central paradox":"The same systems can enable both."},"related":["PeerVeer","Cameraudio","The Alphys","The Awares"]},{"name":"The Past as Resistance","type":"Theme","status":"Canon","summary":"Retro culture is not merely nostalgia. Old objects, social rituals, and physical presence become tools against a frictionless surveillance world.","fields":{"Embodiments":"Skateboards, CFC, old drinks, relic trade, face-to-face trust.","Tension":"The past can preserve humanity, but it can also be commodified by people like Boroughs."},"related":["Retroarians","Chicken Fish Chops","Creed Boroughs"]},{"name":"Public Narrative War","type":"Theme / conflict system","status":"Canon","summary":"The conflict is fought not only through weapons and code, but through who gets blamed, who appears credible, and which story reaches the regs first.","fields":{"Boroughs’ method":"Localized EMP attacks, ambiguous witnesses, Retroboy profiles, and curated suspicion.","Courtney’s role":"Potential counter-narrative, witness, and public conscience.","Risk":"Truth arriving too late may function as another form of defeat."},"related":["Courtney Range","Creed Boroughs","Cameraudio","Retroarians"]},{"name":"The Dream Signal","type":"Mystery / symbol","status":"Developing","summary":"Dreams, equations, pulse, fire, and recognition seem to draw Roman, Victor, and Ekia toward a shared structure older than their separate vocabularies.","fields":{"Roman’s lens":"His father and relational equations.","Victor’s lens":"Numbers, models,
