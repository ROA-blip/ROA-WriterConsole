  entries:[
    {name:"The story’s central axis",type:"Theme decision",status:"Canon",summary:"ROA asks: What does it really mean to awaken?",fields:{"Opening proposition":"People don’t believe what they see. They see what they believe.","Opposite of awareness":"Certainty—the conviction that one’s current frame is complete.","Character test":"Every major character believes they are awake and is wrong in a different way.","Chapter test":"Each chapter should deepen, challenge, or complicate the meaning of awareness."},related:["Knowledge, Understanding, Wisdom","People See What They Believe"]},
    {name:"Character before technology",type:"Story architecture",status:"Canon",summary:"Technology exists to pressure character, belief, relationship, and choice—not to compete with the human story.",fields:{"Rule":"Build only enough technology to establish consequence, limitation, and lived experience.","Test":"If a device can be removed without changing a character’s choice, it may be ornamental.","ROA application":"Ngoma matters because of what Ekia believes power is for; Fox matters because Roman may be teaching a tool to become a witness."},related:["Dr. Ekia Tjambiru","Fox","Ngoma Shield"]},
    {name:"Zakaria is the saboteur",type:"Plot decision",status:"Canon",summary:"Zakaria—not a random villager—sabotages the directed EMP cannon, making the betrayal personal and structurally decisive.",fields:{"Consequence":"The defenders lose their clean answer to the drone swarm.","Immediate result":"Range and Soulman order Ekia and her staff extracted.","Dramatic value":"The danger comes from compromised belief inside the community as well as force outside it."},related:["Zakaria","Directed EMP Cannon","Rodney Range","Soulman"]},
    {name:"EMP defense division",type:"Technology decision",status:"Canon",summary:"Ngoma protects against EMP attack; the directed EMP cannon defeats attacking drones. The defenses are complementary, not interchangeable.",fields:{"Ngoma Shield":"Prevents or neutralizes EMP damage to protected systems.","Directed EMP Cannon":"Projects a focused disruptive pulse against drone electronics.","Story consequence":"Sabotaging the cannon leaves the shield intact but makes the compound vulnerable to conventional drone assault."},related:["Ngoma Shield","Directed EMP Cannon","Himba Compound"]},
    {name:"Ekia’s contingency handoff",type:"Scene decision",status:"Canon",summary:"Before evacuation, Ekia entrusts two different carriers with two different forms of knowledge.",fields:{"Soulman receives":"The Holographic Octahedral Crystal Drive.","Range receives":"A plain synthetic-DNA data ring, placed on his left pinky.","Key line":"The fire spoke to me last night, and I listened.","Meaning":"Scientific foresight and ancestral perception are one decision, not competing explanations."},related:["Dr. Ekia Tjambiru","Soulman","Rodney Range"]},
    {name:"Only one",type:"Relationship decision",status:"Canon",summary:"“Only one” is the private Range-sibling code for true love and the key Range uses when entrusting Courtney with world-changing information.",fields:{"Emotional payoff":"Range admits he may have met his ‘only one.’","Structural purpose":"The phrase connects intimacy, trust, encryption, and responsibility.","Continuity":"Keep the phrase rare so each use retains weight."},related:["Rodney Range","Courtney Range","Dr. Ekia Tjambiru"]}

DB.sections.overview.entries.push({
  name:"The awakening compass",type:"Writer’s compass",status:"Canon",
  summary:"The governing idea of ROA: people do not simply believe what they see; they see what they already believe.",
  fields:{"Central question":"What does it really mean to awaken?","Opposite of awareness":"Certainty.","Character principle":"Every major character believes they are awake and is wrong in a different way.","Worldbuilding principle":"Institutions and technologies should reveal, reward, manipulate, or fracture belief.","Drafting question":"What belief controls this scene—and what does the scene force someone to see?"},
  related:["Knowledge, Understanding, Wisdom","Roman Tollman","Victor","Dr. Ekia Tjambiru","Creed Boroughs"]
});
DB.entries = Object.entries(DB.sections).flatMap(([section,s])=>s.entries.map(e=>({...e,section})));
const labels = {overview:"Overview",characters:"Characters",factions:"Factions",technology:"Technology",locations:"Locations",themes:"Themes",timeline:"Timeline",knowledge:"Who Knows What?",continuity:"Continuity Desk",threads:"Open Plot Threads",decisions:"Decision Log"};
let activeSection = "overview";
let searchTerm = "";
let statusFilter = "";
const nav = document.getElementById("nav"), cards = document.getElementById("cards"), detail = document.getElementById("detail");
const listView = document.getElementById("listView"), graph = document.getElementById("graph");
const title = document.getElementById("sectionTitle"), desc = document.getElementById("sectionDesc"), stats = document.getElementById("stats");

function statusClass(s) {
  if ((s||"").includes("Canon")) return "canon";
  if ((s||"").includes("Developing")) return "developing";
  if ((s||"").includes("Review")) return "review";
  return "";
}
function renderNav() {
  nav.innerHTML = "";
  Object.keys(DB.sections).forEach(k => {
    const b=document.createElement("button"); b.className="navbtn"+(k===activeSection?" active":"");
    b.innerHTML=`${labels[k]} <span class="count">${DB.sections[k].entries.length}</span>`;
    b.onclick=()=>{activeSection=k; searchTerm=""; document.getElementById("search").value=""; showEntries();};
    nav.appendChild(b);
  });
}
function filteredEntries() {
  const source = searchTerm ? DB.entries : DB.sections[activeSection].entries.map(e=>({...e,section:activeSection}));
  const q=searchTerm.toLowerCase();
  return source.filter(e => (!q || JSON.stringify(e).toLowerCase().includes(q)) && (!statusFilter || (e.status||"").includes(statusFilter)));
}
function showEntries() {
  detail.className="detail"; graph.className="graphwrap"; listView.style.display="block";
  document.getElementById("cardsView").classList.add("active"); document.getElementById("graphView").classList.remove("active");
  renderNav();
  const sec=DB.sections[activeSection];
  title.textContent=searchTerm?`Search: “${searchTerm}”`:sec.title;
  desc.textContent=searchTerm?"Results across the entire ROA Bible.":sec.description;
  const entries=filteredEntries();
  const canon=entries.filter(e=>(e.status||"").includes("Canon")).length;
  const dev=entries.filter(e=>(e.status||"").includes("Developing")).length;
  const review=entries.filter(e=>(e.status||"").includes("Review")).length;
  stats.innerHTML=`<div class="stat"><b>${entries.length}</b><span>Visible entries</span></div><div class="stat"><b>${canon}</b><span>Canon</span></div><div class="stat"><b>${dev}</b><span>Developing</span></div><div class="stat"><b>${review}</b><span>Needs review</span></div>`;
  cards.innerHTML="";
  if(!entries.length){cards.innerHTML='<div class="empty">No matching entries. Try a broader term.</div>';return;}
  entries.forEach(e=>{
    const c=document.createElement("article"); c.className="card";
    c.innerHTML=`<span class="badge ${statusClass(e.status)}">${e.status||"Reference"}</span><h3>${e.name}</h3><p>${e.summary}</p>`;
    c.onclick=()=>showDetail(e.name);
    cards.appendChild(c);
  });
}
function findEntry(name) { return DB.entries.find(e=>e.name===name); }
function showDetail(name) {
  const e=findEntry(name); if(!e) return;
  listView.style.display="none"; graph.className="graphwrap"; detail.className="detail open";
  const fields=Object.entries(e.fields||{}).map(([k,v])=>`<div class="field"><h4>${k}</h4><p>${v}</p></div>`).join("");
  const related=(e.related||[]).map(r=>`<button class="pill" type="button" data-rel="${r.replaceAll('"','&quot;')}">${r}</button>`).join("");
  detail.innerHTML=`<button class="back" type="button">← Back</button><div><span class="badge ${statusClass(e.status)}">${e.status}</span> <span class="badge">${e.type}</span></div><h2>${e.name}</h2><p class="summary">${e.summary}</p><div class="fields">${fields}</div>${related?`<div class="related"><h3>Connected entries</h3>${related}</div>`:""}`;
  detail.querySelector(".back").onclick=showEntries;
  detail.querySelectorAll("[data-rel]").forEach(b=>b.onclick=()=>showDetail(b.dataset.rel));
  window.scrollTo({top:0,behavior:"smooth"});
}
function showGraph() {
  listView.style.display="none"; detail.className="detail"; graph.className="graphwrap open";
  document.getElementById("cardsView").classList.remove("active"); document.getElementById("graphView").classList.add("active");
  const nodeMap=Object.fromEntries(DB.nodes.map(n=>[n[0],n]));
  const lines=DB.edges.map(([a,b,label])=>{
    const A=nodeMap[a], B=nodeMap[b], mx=(A[1]+B[1])/2, my=(A[2]+B[2])/2;
    return `<line class="edge" x1="${A[1]}" y1="${A[2]}" x2="${B[1]}" y2="${B[2]}"/><text class="edge-label" x="${mx}" y="${my-6}" text-anchor="middle">${label}</text>`;
  }).join("");
  const nodes=DB.nodes.map(([name,x,y])=>`<g class="node" data-name="${name}"><circle cx="${x}" cy="${y}" r="51"/><text x="${x}" y="${y-4}">${name.split(" ").slice(0,2).join(" ")}</text><text x="${x}" y="${y+14}">${name.split(" ").slice(2).join(" ")}</text></g>`).join("");
  graph.innerHTML=`<div class="hero"><h2>Relationship Map</h2><p>Click any character or faction to open its full entry. The map focuses on the current convergence and is designed to expand.</p></div><svg viewBox="0 0 840 590" role="img" aria-label="ROA central relationship map">${lines}${nodes}</svg>`;
  graph.querySelectorAll(".node").forEach(n=>n.onclick=()=>showDetail(n.dataset.name));
}
document.getElementById("search").addEventListener("input",e=>{searchTerm=e.target.value.trim();showEntries();});
document.getElementById("statusFilter").addEventListener("change",e=>{statusFilter=e.target.value;showEntries();});
document.getElementById("cardsView").onclick=showEntries;
document.getElementById("graphView").onclick=showGraph;
renderNav(); showEntries();
</script>
</body>
</html>
